<script type="module">
/* ==========================================================================
   pgquire ("pg, inquire") — a single-file Postgres workbench on PGlite, with an optional AI Clerk.
   Browser storage: working data in IndexedDB 'pgquire-app'; small settings keep their 'ledger:'
   localStorage prefix so they carry over.
   (Visual language: a ledger book. Storage keys keep the 'ledger:' prefix for continuity.)
   ========================================================================== */
const APP_VERSION = '1.0';                                                                    // bump on each release
const PGLITE_URL = 'https://cdn.jsdelivr.net/npm/@electric-sql/pglite@0.5.8/dist/index.js';
const PGDUMP_URL = 'https://cdn.jsdelivr.net/npm/@electric-sql/pglite-tools@0.4.8/dist/pg_dump.js';   // pg_dump built for PGlite 0.5.8
const DEFAULT_BASE = 'https://openrouter.ai/api/v1';
const DEFAULT_MODEL = 'xiaomi/mimo-v2.5';
const PAGE_SIZES = [25, 50, 100, 250, 500, 1000, 2000];
const pageSize = () => store.get('pageSize', 100);   // rows per page in a table's Rows view; double-click the footer count to change it
const REMOTE_COUNT_CAP = 100000;   // filtered counts on remote tables stop here // @remote
const MAX_STEPS = 16;

/* ---------- tiny helpers ---------- */
const $ = id => document.getElementById(id);
function h(tag, props, ...kids) {
  const n = document.createElement(tag);
  if (props) for (const [k, v] of Object.entries(props)) {
    if (v == null || v === false) continue;
    if (k === 'class') n.className = v;
    else if (k === 'style') n.style.cssText = v;
    else if (k.startsWith('on') && typeof v === 'function') n.addEventListener(k.slice(2).toLowerCase(), v);
    else if (k === 'html') n.innerHTML = v;
    else if (k in n && k !== 'list' && k !== 'form') n[k] = v;
    else n.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat(Infinity)) if (c != null && c !== false) n.append(c instanceof Node ? c : String(c));
  return n;
}
const ic = (name, style) => { const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg'); s.setAttribute('class', 'ic'); if (style) s.setAttribute('style', style); s.innerHTML = `<use href="#i-${name}"/>`; return s; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const qi = s => '"' + String(s).replace(/"/g, '""') + '"';
const lit = v => v == null ? 'NULL' : "'" + String(v).replace(/'/g, "''") + "'";
const plural = (n, w) => `${n.toLocaleString()} ${w}${n === 1 ? '' : 's'}`;
const uid = () => Math.random().toString(36).slice(2, 9);
/* ---------- storage ----------
   Small settings stay in localStorage. Per-database working data — conversations and the model's
   history, journal, saved queries, tabs, ERD layouts — lives in IndexedDB: localStorage's ~5 MB is
   shared by every HTML file opened from disk and fails silently when full. Reads come from an
   in-memory copy loaded at startup; writes are batched in the background, and failures are shown. */
const KV_PREFIXES = ['clerkv2:', 'conv:', 'journal:', 'saved:', 'tabs:', 'map:'];
const kv = { db: null, cache: new Map(), dirty: new Map(), timer: null, failed: false, fallback: false };
const isKv = k => !kv.fallback && KV_PREFIXES.some(p => k.startsWith(p));
let storageWarnAt = 0;
const storageWarn = msg => { if (Date.now() - storageWarnAt > 20000) { storageWarnAt = Date.now(); toast(msg, 'bad'); } };
/* Settings are read often (the database list on every currentDb()), so each is parsed once and kept;
   another tab changing one drops the kept copy (the storage event). */
const lsCache = new Map();
addEventListener('storage', e => { if (e.key == null) lsCache.clear(); else if (e.key.startsWith('ledger:')) lsCache.delete(e.key.slice(7)); });
const store = {
  get(k, d) {
    if (isKv(k)) return kv.cache.has(k) ? kv.cache.get(k) : d;
    if (!lsCache.has(k)) { let v; try { v = JSON.parse(localStorage.getItem('ledger:' + k)); } catch { v = null; } lsCache.set(k, v); }
    return lsCache.get(k) ?? d;
  },
  set(k, v) {
    if (isKv(k)) return kvPut(k, v);
    const json = JSON.stringify(v);
    lsCache.set(k, json === undefined ? null : JSON.parse(json));
    try { localStorage.setItem('ledger:' + k, json); }
    catch (e) { storageWarn(`Couldn't save a setting — browser storage is full (${e.name}).`); }
  },
  del(k) { if (isKv(k)) return kvPut(k, undefined); lsCache.delete(k); localStorage.removeItem('ledger:' + k); },
  keys: prefix => [...kv.cache.keys()].filter(k => k.startsWith(prefix)),
};
function kvPut(k, v) {
  const val = v === undefined ? undefined : JSON.parse(JSON.stringify(v));   // a detached, clone-safe copy
  val === undefined ? kv.cache.delete(k) : kv.cache.set(k, val);
  kv.dirty.set(k, val);
  clearTimeout(kv.timer); kv.timer = setTimeout(kvFlush, 120);
}
function kvFlush() {
  if (!kv.db || !kv.dirty.size) return Promise.resolve(true);
  clearTimeout(kv.timer);
  const batch = [...kv.dirty]; kv.dirty.clear();
  return new Promise(res => {
    let tx;
    const fail = err => {
      for (const [k, v] of batch) if (!kv.dirty.has(k)) kv.dirty.set(k, v);   // keep for retry
      kv.failed = true;
      storageWarn(`Couldn't save to browser storage (${err?.name || 'error'}). Your work is still on screen — export a session to be safe.`);
      kv.timer = setTimeout(kvFlush, 5000);
      res(false);
    };
    try { tx = kv.db.transaction('kv', 'readwrite'); } catch (e) { return fail(e); }
    const os = tx.objectStore('kv');
    for (const [k, v] of batch) v === undefined ? os.delete(k) : os.put(v, k);
    tx.oncomplete = () => { if (kv.failed) { kv.failed = false; toast('Saving works again ✓'); } res(true); };
    tx.onerror = e => { e.preventDefault(); };
    tx.onabort = () => fail(tx.error);
  });
}
/** Open IndexedDB, load everything into memory, and (once) move data out of localStorage. */
async function kvInit() {
  kv.db = await new Promise((res, rej) => {
    const r = indexedDB.open('pgquire-app', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); r.onblocked = () => rej(new Error('storage is blocked by another tab'));
  });
  await new Promise((res, rej) => {
    const tx = kv.db.transaction('kv'), os = tx.objectStore('kv'), kr = os.getAllKeys(), vr = os.getAll();
    tx.oncomplete = () => { kr.result.forEach((k, i) => kv.cache.set(k, vr.result[i])); res(); };
    tx.onerror = () => rej(tx.error);
  });
  const legacy = Object.keys(localStorage).filter(k => k.startsWith('ledger:') && KV_PREFIXES.some(p => k.startsWith('ledger:' + p)));
  if (!legacy.length) return 0;
  const moved = [];
  for (const lk of legacy) {
    const k = lk.slice(7);
    if (kv.cache.has(k)) { moved.push(lk); continue; }               // already migrated earlier
    try { const v = JSON.parse(localStorage.getItem(lk)); kv.cache.set(k, v); kv.dirty.set(k, v); moved.push(lk); } catch {}
  }
  if (!(await kvFlush())) return 0;
  // Read everything back and compare before freeing the shared localStorage space.
  const ok = await new Promise(res => {
    const tx = kv.db.transaction('kv'), os = tx.objectStore('kv');
    const got = moved.map(lk => os.get(lk.slice(7)));
    tx.oncomplete = () => res(got.every((g, i) => JSON.stringify(g.result) === JSON.stringify(kv.cache.get(moved[i].slice(7)))));
    tx.onerror = () => res(false);
  });
  if (ok) moved.forEach(lk => localStorage.removeItem(lk));
  return ok ? moved.length : 0;
}
addEventListener('pagehide', () => { kvFlush(); });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') kvFlush(); });
const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };

/* ---------- global state ---------- */
const S = {
  db: null, id: null, PGlite: null,
  tables: [], byKey: {}, counts: {}, flash: new Set(),
  tabs: [], active: null,
  undo: [], journal: [],
  expanded: new Set(),
  clerk: { base: store.get('base', DEFAULT_BASE), model: store.get('model', DEFAULT_MODEL), key: null, busy: false, abort: null, stop: false, allowAll: false, items: [], convo: [], ctxOn: true, convs: [], cur: null, attach: new Set(), attachQ: new Set(), pricing: {} },
};

/* ==========================================================================
   Database lifecycle
   ========================================================================== */
const loadDbs = () => store.get('dbs', []);
const saveDbs = d => store.set('dbs', d);
const currentDb = () => loadDbs().find(d => d.id === S.id);

function newDbMeta(name) {
  const dbs = loadDbs();
  let n = dbs.length + 1;
  while (!name && dbs.some(d => d.name === `db-${n}`)) n++;
  // Colour: random, preferring one no other database uses yet.
  const d = { id: uid(), name: name || `db-${n}`, created: Date.now(), hue: randomHue(dbs) };
  dbs.push(d); saveDbs(dbs);
  return d;

async function openDb(id, opts = {}) {
  persistTabs();
  if (S.db) { await S.db.close().catch(() => {}); S.db = null; }
  S.id = id; store.set('active', id);
  saveDbs(loadDbs().map(d => d.id === id ? { ...d, opened: Date.now() } : d));
  S.tables = []; S.byKey = {}; S.counts = {}; S.undo = [];
  showDbKind();
  document.title = `${dbLabel(currentDb()) || 'pgquire'} · pgquire`;
  applyDbColor();
  bootMsg('opening the books…', true);
  try {
    const inst = await connectDb(id, opts);
    if (S.id !== id) { inst.close(); return; }
    S.db = inst;
    await refreshSchema({ initial: true });
    S.journal = store.get(`journal:${id}`, []);
    restoreTabs();
    loadClerk();
    renderAll();
    bootMsg(null);
  } catch (e) {
    console.error(e);
    /* @remote { */
    if (isRemote(id)) {                          // don't strand the user on the boot screen: go back to a local database
      toast(`Couldn't connect to “${currentDb()?.name}”: ${e.message}`, 'bad',
        e.status === 401 && { label: 'Paste token', run: async () => { if (await signInDialog()) openDb(id); } });
      const local = loadDbs().find(d => !d.kind);
      return openDb((local || newDbMeta()).id);
    }
    /* } @remote */
    bootMsg(navigator.onLine ? `Couldn't open the database: ${e.message}` : 'Offline — the Postgres engine needs to download once.', true, true);
  }
}

const TYPE_CAT = { 16: 'B', 20: 'N', 21: 'N', 23: 'N', 26: 'N', 700: 'N', 701: 'N', 1700: 'N', 114: 'U', 3802: 'U' };

/** "(floor_id, property_id) → floor(id, property_id) · on delete restrict" */
const fkLabel = f => `(${f.cols.join(', ')}) → ${f.ref}(${f.refCols.join(', ')})${f.onDelete && f.onDelete !== 'no action' ? ` · on delete ${f.onDelete}` : ''}`;
const fkTitle = c => (c.fks || []).map(fkLabel).join('\n');

async function refreshSchema({ initial } = {}) {
  const relFilter = `c.relkind in ('r','v','m','p') and n.nspname <> 'information_schema' and n.nspname !~ '^pg_'`;
  const rels = await q(`select c.oid::int as oid, n.nspname as schema, c.relname as name, c.relkind::text as kind
    from pg_class c join pg_namespace n on n.oid = c.relnamespace where ${relFilter} order by n.nspname <> 'public', 2, 3`);
  const cols = await q(`select a.attrelid::int as oid, a.attname as name, format_type(a.atttypid, a.atttypmod) as type,
      t.typcategory::text as cat, a.attnotnull as notnull, pg_get_expr(d.adbin, d.adrelid) as def, a.attnum::int as num,
      a.attidentity::text as ident, a.attgenerated::text as gen
    from pg_attribute a join pg_type t on t.oid = a.atttypid
    left join pg_attrdef d on d.adrelid = a.attrelid and d.adnum = a.attnum
    where a.attrelid in (select c.oid from pg_class c join pg_namespace n on n.oid = c.relnamespace where ${relFilter})
      and a.attnum > 0 and not a.attisdropped order by a.attrelid, a.attnum`);
  const trg = await q(`select tgrelid::int as oid, array_agg(tgname::text order by tgname) as names from pg_trigger
    where not tgisinternal and tgrelid in (select c.oid from pg_class c join pg_namespace n on n.oid = c.relnamespace where ${relFilter}) group by tgrelid`);
  const cons = await q(`select conrelid::int as oid, contype::text as type, conname as name, conkey::int[] as keys,
      confrelid::int as roid, confkey::int[] as rkeys, pg_get_constraintdef(oid) as def
    from pg_constraint where conrelid in (select c.oid from pg_class c join pg_namespace n on n.oid = c.relnamespace where ${relFilter})
    order by contype, conname`);

  const byOid = {};
  const tables = rels.rows.map(r => {
    const key = r.schema === 'public' ? r.name : `${r.schema}.${r.name}`;
    const t = { oid: r.oid, schema: r.schema, name: r.name, key, kind: r.kind, cols: [], pk: [], fks: [], cons: [], editable: (r.kind === 'r' || r.kind === 'p')/*remote:*/ && !readOnlyConn()/*:remote*/ };
    byOid[r.oid] = t;
    return t;
  });
  for (const r of trg.rows) if (byOid[r.oid]) byOid[r.oid].triggers = r.names;
  for (const c of cols.rows) byOid[c.oid]?.cols.push({ name: c.name, type: c.type, cat: c.cat, notnull: c.notnull, def: c.def, num: c.num, ident: c.ident, gen: c.gen });
  const colAt = (t, num) => t?.cols.find(c => c.num === num)?.name;
  for (const c of cons.rows) {
    const t = byOid[c.oid]; if (!t) continue;
    t.cons.push({ name: c.name, type: c.type, def: c.def });
    const names = (c.keys || []).map(k => colAt(t, k));
    if (c.type === 'p') t.pk = names;
    if (c.type === 'f') {
      const rt = byOid[c.roid];
      const od = /ON DELETE (CASCADE|SET NULL|SET DEFAULT|RESTRICT|NO ACTION)/i.exec(c.def)?.[1];
      t.fks.push({ name: c.name, cols: names, ref: rt?.key, refCols: (c.rkeys || []).map(k => colAt(rt, k)), def: c.def, onDelete: od ? od.toLowerCase() : 'no action' });
    }
  }
  for (const t of tables) for (const c of t.cols) {
    c.pk = t.pk.includes(c.name);
    c.fks = t.fks.filter(f => f.cols.includes(c.name));    // a column can sit in several (composite) keys
    c.fk = c.fks[0]?.ref || null;
  }

  // Row counts for base tables (views may be expensive).
  const counted = tables.filter(t => t.kind !== 'v');
  const counts = {}, approx = new Set();
  /* @remote { */
  if (counted.length && S.db.remote) {
    // A real server can hold huge tables: count small ones exactly, take the planner's estimate for the rest.
    const est = await q(`select c.oid::int as oid, pg_relation_size(c.oid) < 8388608 and c.relkind in ('r', 'm') as small,
        (case when c.relkind = 'p' then (select sum(greatest(ch.reltuples, 0)) from pg_inherits i join pg_class ch on ch.oid = i.inhrelid where i.inhparent = c.oid)
              else coalesce(nullif(c.reltuples, -1), s.n_live_tup, 0) end)::bigint as n
      from pg_class c left join pg_stat_all_tables s on s.relid = c.oid where c.oid = any($1::int[])`, [counted.map(t => t.oid)]);
    const byOid = new Map(counted.map(t => [t.oid, t]));
    const small = [];
    for (const r of est.rows) { const t = byOid.get(r.oid); if (!t) continue; if (r.small) small.push(t); else { counts[t.key] = r.n; approx.add(t.key); } }
    const parts = small.map((t, i) => `select ${i} as i, count(*)::int as n from ${qt(t)}`);
    for (let i = 0; i < parts.length; i += 60) {
      const r = await q(parts.slice(i, i + 60).join(' union all '));
      for (const row of r.rows) counts[small[row.i].key] = row.n;
    }
  } else if (counted.length) {
  /* } @remote */
  // @pages: if (counted.length) {
    const parts = counted.map((t, i) => `select ${i} as i, count(*)::int as n from ${qt(t)}`);
    for (let i = 0; i < parts.length; i += 60) {
      const r = await q(parts.slice(i, i + 60).join(' union all '));
      for (const row of r.rows) counts[counted[row.i].key] = row.n;
    }
  }
  if (!initial) for (const t of tables) if (counts[t.key] !== S.counts[t.key] || !S.byKey[t.key]) S.flash.add(t.key);
  S.tables = tables; S.counts = counts; S.approx = approx;
  S.exts = await installedExtensions(S.db).catch(() => []);
  S.schemas = (await q(`select n.nspname as name from pg_namespace n where n.nspname !~ '^pg_' and n.nspname <> 'information_schema'
    order by n.nspname <> 'public', 1`)).rows.map(r => r.name);
  await readSearchPath();
  S.byKey = Object.fromEntries(tables.map(t => [t.key, t]));
}
/* ---------- the search path, shown in every query tab's toolbar ----------

  catch { S.schema = null; }                // e.g. inside a failed transaction: hide rather than guess

const tableKey = (schema, name) => schema === 'public' ? name : `${schema}.${name}`;
const curSchema = () => S.schema?.cur || 'public';
/** A schema <select> for dialogs that create tables — null when the database has only one schema. */

/** After anything that might have changed data or schema. */
async function afterWrite({ keepActive } = {}) {

/* ==========================================================================
   Tabs
   ========================================================================== */
const activeTab = () => S.tabs.find(t => t.id === S.active);
function persistTabs() {
  if (!S.id || !S.db) return;
  store.set(`tabs:${S.id}`, {
    activeIndex: S.tabs.findIndex(t => t.id === S.active),
    tabs: S.tabs.map(t => t.type === 'table' ? { type: 'table', key: t.key, view: t.view, rel: t.rel || undefined } : t.type === 'query' ? { type: 'query', title: t.title, sql: t.sql, savedId: t.savedId || null } : t.type === 'map' ? { type: 'map', schemas: t.schemas || [] } : { type: t.type }),
  });
}
function restoreTabs() {
  const saved = store.get(`tabs:${S.id}`, null);
  S.tabs = []; S.active = null;
  if (!saved) return;
  let activeIdx = -1;
  saved.tabs.forEach((t, i) => {
    const tab = t.type === 'table' ? (S.byKey[t.key] ? Object.assign(mkTableTab(t.key, t.view), { rel: !!t.rel }) : null)
      : t.type === 'query' ? Object.assign(mkQueryTab(t.sql, t.title), { savedId: t.savedId || null })
      : t.type === 'map' ? { id: uid(), type: 'map', schemas: t.schemas || (t.schema ? [t.schema] : []) }
      : t.type === 'readme' ? { id: uid(), type: 'readme' } : null;
    if (!tab) return;
    S.tabs.push(tab);
    if (i === saved.activeIndex) activeIdx = S.tabs.length - 1;
  });
  S.active = S.tabs[activeIdx]?.id || null;
}

function mkTableTab(key, view = 'rows') { return { id: uid(), type: 'table', key, view, filter: '', sort: null, page: 0, rows: [], total: 0, sel: new Set(), focus: null, dirty: true, draft: null }; }
function mkQueryTab(sql = '', title) {
  const n = S.tabs.filter(t => t.type === 'query').length + 1;
  return { id: uid(), type: 'query', title: title || `Query ${n}`, sql, results: null, error: null, ri: 0, ms: null, split: store.get('split', 38) };
}
function openTable(key, opts = {}) {
  let tab = S.tabs.find(t => t.type === 'table' && t.key === key);
  if (!tab) { tab = mkTableTab(key, opts.view); S.tabs.push(tab); }
  if (opts.view) tab.view = opts.view;
  if (opts.rel) tab.rel = true;                               // from the ERD: show the relations diagram
  if (opts.filter != null) { tab.filter = opts.filter; tab.page = 0; tab.dirty = true; }
  activate(tab.id);
  return tab;
}
function openQuery(sql = '', { title, run } = {}) {
  const tab = mkQueryTab(sql, title);
  S.tabs.push(tab); activate(tab.id);
  if (run) runQueryTab(tab, sql);
  return tab;
}
function openMap() {
  let tab = S.tabs.find(t => t.type === 'map');
  if (!tab) {
    // A new ERD shows everything — unless you've pointed the search path somewhere yourself.
    const sp = S.schema, custom = sp?.cur && sp.path.replace(/\s+/g, '') !== sp.def?.replace(/\s+/g, '');
    tab = { id: uid(), type: 'map', schemas: custom && S.tables.some(t => t.schema === sp.cur) ? [sp.cur] : [] };
    S.tabs.push(tab);

function activate(id) { S.active = id; persistTabs(); renderTabs(); renderIndex(); renderPane(); renderClerkCtx(); closeIndexMobile(); }
function closeTab(id) {
  const i = S.tabs.findIndex(t => t.id === id);
  if (i < 0) return;
  S.tabs.splice(i, 1);
  if (S.active === id) S.active = (S.tabs[i] || S.tabs[i - 1])?.id || null;
  persistTabs(); renderTabs(); renderIndex(); renderPane(); renderClerkCtx();
}

let lastTabClick = {};
function setQueryTitle(tab, n) {
  tab.title = n;
  if (tab.savedId) storeSaved(loadSaved().map(x => x.id === tab.savedId ? { ...x, title: n, updated: Date.now() } : x));

function renameTabInline(tab, span) {
  if (!span) return;
  const input = h('input', { class: 'tab-rename', value: tab.title, spellcheck: false });
  span.replaceWith(input);
  input.focus(); input.select();
  let done = false;
  const finish = save => {
    if (done) return; done = true;
    const v = input.value.trim();
    if (save && v && v !== tab.title) setQueryTitle(tab, v); else renderTabs();
  };
  input.onkeydown = e => { e.stopPropagation(); if (e.key === 'Enter') { e.preventDefault(); finish(true); } else if (e.key === 'Escape') finish(false); };
  input.onblur = () => finish(true);
  input.onclick = input.ondblclick = e => e.stopPropagation();
}

/** Close several tabs at once; asks only when a query tab among them has SQL that isn't saved. */
async function closeTabs(ids) {
  const set = new Set(ids), list = S.tabs.filter(t => set.has(t.id));
  if (!list.length) return;

  if (unsaved && !(await confirmDlg({ title: `Close ${plural(list.length, 'tab')}?`, body: `${plural(unsaved, 'query tab')} with unsaved SQL will be closed — anything you ran is still in the journal.`, ok: 'Close' }))) return;

/* The tab strip scrolls sideways under a plain mouse wheel (its scrollbar is hidden). */
$('tabs').addEventListener('wheel', e => {

  e.preventDefault();

async function closeAllTabs() {

const loadSaved = () => store.get(`saved:${S.id}`, []);
const storeSaved = list => store.set(`saved:${S.id}`, list);

async function saveQueryTab(tab) {
  const list = loadSaved();

  if (!sq) {
    const name = await promptDlg({ title: 'Save query', label: 'Name', value: /^Query \d+$/.test(tab.title) ? '' : tab.title });

    list.push(sq);

  } else Object.assign(sq, { sql: tab.sql, title: tab.title, updated: Date.now() });

function openSaved(sq, { run } = {}) {

  tab.savedId = sq.id; persistTabs(); renderTabs();

}
function savedMenu(sq, x, y) {

    { label: 'Rename…', icon: 'pen', run: async () => {

      storeSaved(loadSaved().map(x => x.id === sq.id ? { ...x, title: n } : x));

      persistTabs(); renderTabs(); renderIndex(); if (activeTab()?.savedId === sq.id) renderPane();

    ...S.tabs.map(t => {

      const iconName = t.type === 'table' ? (S.byKey[t.key]?.kind === 'v' ? 'view' : 'table') : t.type === 'query' ? 'query' : t.type === 'readme' ? 'book' : 'map';
      const el = h('div', { class: `tab t-${t.type}` + (t.id === S.active ? ' active' : ''), title: label },
        ic(iconName), h('span', { class: 'tt' }, label),
        t.type === 'query' && (() => {
          const sq = savedOf(t), changed = sq && sq.sql !== t.sql;

        })(),

      el.onclick = e => {
        if (e.target.closest('button, input')) return;
        const now = Date.now();
        if (t.type === 'query' && lastTabClick.id === t.id && now - lastTabClick.t < 450) {
          lastTabClick = {};
          renameTabInline(t, $('tabs').querySelector(`[data-tab="${t.id}"] .tt`));
          return;
        }
        lastTabClick = { id: t.id, t: now };
        if (S.active !== t.id) activate(t.id);
      };
      el.onauxclick = e => { if (e.button === 1) closeTab(t.id); };
      el.oncontextmenu = e => { e.preventDefault(); tabMenu(t, e.clientX, e.clientY); };

function renderPane() {
  const tab = activeTab();
  const pane = $('pane');
  // Redrawing the query tab already on screen keeps its editor: re-attaching a big script costs seconds of layout.
  const keep = S.db && tab?.type === 'query' && tab._ed?.edWrap.parentNode === pane;
  if (keep) for (const c of [...pane.children]) { if (c !== tab._ed.edWrap) c.remove(); }
  else pane.replaceChildren();
  if (!S.db) return;
  if (!tab) return renderHome(pane);
  if (tab.type === 'table') return renderTableTab(tab, pane);
  if (tab.type === 'query') return renderQueryTab(tab, pane, keep);
  if (tab.type === 'map') return renderMap(tab, pane);
  if (tab.type === 'readme') return renderReadme(pane);
}

/* Prism: a stable hue per table name, and one per column position (golden-angle steps keep neighbours apart).
   Only the angle is set here (--hh); the CSS turns it into a colour for the current day/night theme. */
const nameHue = s => ([...s].reduce((a, c) => (a * 31 + c.charCodeAt(0)) >>> 0, 7) % HUE_STEPS) * HUE_STEP;
const colHue = i => ((250 + i * 137.508) % 360).toFixed(1);
const compact = new Intl.NumberFormat('en', { notation: 'compact', maximumFractionDigits: 1 });
const parseTime = v => Date.parse(String(v).replace(' ', 'T').replace(/([+-]\d\d)$/, '$1:00'));
/** Prism: a small profile of one column from the rows on this page — a histogram for numbers and times,
    the mix of values when there are few, how unique they are otherwise — plus the share of nulls. */
function colProfile(c, vals) {
  const n = vals.length;
  if (!n) return null;
  const nn = vals.filter(v => v != null), nulls = n - nn.length;
  const pct = x => Math.round(x / n * 100) + '%';
  const distinct = new Map();
  for (const v of nn) distinct.set(v, (distinct.get(v) || 0) + 1);
  const stack = parts => h('div', { class: 'stack' }, parts.filter(p => p[0] > 0).map(([k, cls, op, tip]) => h('i', { class: cls, style: `flex:${k}${op != null ? ';opacity:' + op : ''}`, title: tip })));
  const meta = [];
  let viz = null;
  const nums = c.cat === 'N' ? nn.map(Number) : c.cat === 'D' ? nn.map(parseTime) : [];
  const fin = nums.filter(Number.isFinite);
  if (c.cat === 'B') {
    const t = nn.filter(v => v === 't' || v === true || v === 'true').length;
    viz = stack([[t, '', null, `true · ${t}`], [nn.length - t, 'rest', null, `false · ${nn.length - t}`]]);
    if (nn.length) meta.push(Math.round(t / nn.length * 100) + '% true');
  } else if (fin.length > 1 && fin.length === nn.length && distinct.size > 6 && !c.pk && !c.fks?.length) {   // keys: how unique, not a histogram
    const lo = Math.min(...fin), hi = Math.max(...fin), B = 14, bins = Array(B).fill(0);
    for (const x of fin) bins[hi === lo ? 0 : Math.min(B - 1, Math.floor((x - lo) / (hi - lo) * B))]++;
    const mx = Math.max(...bins), w = 100 / B;
    viz = h('div', { html: `<svg viewBox="0 0 100 24" preserveAspectRatio="none">${bins.map((b, i) => b ? `<rect x="${(i * w + .6).toFixed(2)}" y="${(24 - b / mx * 22).toFixed(2)}" width="${(w - 1.2).toFixed(2)}" height="${(b / mx * 22).toFixed(2)}" rx=".8" fill="var(--h)" opacity="${(.35 + .65 * b / mx).toFixed(2)}"/>` : '').join('')}</svg>` });
    if (c.cat === 'N') meta.push(`${compact.format(lo)} – ${compact.format(hi)}`);
    else { const d = x => new Date(x).toLocaleDateString(undefined, { month: 'short', day: 'numeric' }); meta.push(d(lo) === d(hi) ? new Date(lo).toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' }) + ' – ' + new Date(hi).toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' }) : `${d(lo)} – ${d(hi)}`); }
  } else if (distinct.size > 0 && distinct.size <= 6 && nn.length > distinct.size) {
    const top = [...distinct].sort((a, b) => b[1] - a[1]);
    viz = stack(top.map(([v, k], i) => [k, '', (1 - i * .15).toFixed(2), `${v} · ${k}`]));
    meta.push(`${top.length} values · ${String(top[0][0]).slice(0, 14)} ${Math.round(top[0][1] / nn.length * 100)}%`);
  } else if (nn.length) {
    viz = stack([[distinct.size, '', null, `${distinct.size} distinct`], [nn.length - distinct.size, 'rest', null, `${nn.length - distinct.size} repeats`]]);
    meta.push(distinct.size === nn.length ? 'all unique' : `${distinct.size.toLocaleString()} distinct`);
  }
  if (!nn.length) viz = stack([[1, 'rest']]);
  if (nulls) meta.push(nulls === n ? 'all null' : pct(nulls) + ' null');
  return h('div', { class: 'prof' }, viz, h('div', { class: 'pm' }, meta.join(' · ')));
}

function rowIdent(t, row, start) {
  if (t.pk.length) {
    return { where: t.pk.map((p, i) => `${qi(p)} = $${start + i}`).join(' and '), params: t.pk.map(p => row[t.cols.findIndex(c => c.name === p) + 1]) };
  }
  return { where: `ctid = $${start}::tid`, params: [row[0]] };
}
const identReturn = t => t.pk.length ? t.pk.map(p => `${qi(p)}::text`).join(', ') : 'ctid::text';

async function loadRows(tab) {
  const t = S.byKey[tab.key];
  if (!t) return;
  // Values come back as text for lossless round-trips; ORDER BY uses the qualified
  // source column (_t.col) so sorting is by the real type, not the text alias.
  const sel = [t.editable ? '_t.ctid::text' : 'null', ...t.cols.map(c => `_t.${qi(c.name)}::text`)].join(', ');
  const where = tab.filter.trim() ? ` where ${tab.filter}` : '';
  const order = tab.sort ? ` order by _t.${qi(tab.sort.col)} ${tab.sort.dir} nulls last`
    : t.pk.length ? ` order by ${t.pk.map(p => '_t.' + qi(p)).join(', ')}` : t.editable ? ' order by _t.ctid' : '';
  try {
    /* @remote { */
    if (S.db.remote && !where && S.approx?.has(t.key)) { tab.total = S.counts[t.key]; tab.approx = true; }
    else if (S.db.remote) {                                  // count, but stop at a limit
      const cnt = await q(`select count(*)::int as n from (select 1 from ${qt(t)} _t${where} limit ${REMOTE_COUNT_CAP + 1}) _c`);
      tab.total = cnt.rows[0].n; tab.approx = tab.total > REMOTE_COUNT_CAP;
    } else {
    /* } @remote */
    // @pages: {
      const cnt = await q(`select count(*)::int as n from ${qt(t)} _t${where}`);
      tab.total = cnt.rows[0].n; tab.approx = false;
    }
    if (tab.page * pageSize() >= tab.total && tab.page > 0) tab.page = Math.max(0, Math.ceil(tab.total / pageSize()) - 1);
    const res = await q(`select ${sel} from ${qt(t)} _t${where}${order} limit ${pageSize()} offset ${tab.page * pageSize()}`, [], true);
    tab.rows = res.rows; tab.error = null;
  } catch (e) { tab.error = e.message; tab.rows = []; tab.total = 0; }
  tab.dirty = false;
  tab.sel = new Set([...tab.sel].filter(i => i < tab.rows.length));
}

/** The footer's row count becomes a rows-per-page picker; the new size applies to every table tab,
 *  each keeping its first visible row on screen. */
function editPageSize(span) {
  const old = pageSize();
  const sel = h('select', { class: 'pagesize', title: 'Rows per page' }, PAGE_SIZES.map(n => h('option', { value: n, selected: n === old }, `${n.toLocaleString()} per page`)));
  span.replaceWith(sel);
  sel.focus();
  sel.showPicker?.();
  let done = false;
  const finish = n => {
    if (done) return; done = true;
    if (!n || n === old) { sel.replaceWith(span); return; }
    store.set('pageSize', n);
    for (const tab of S.tabs) if (tab.type === 'table') { tab.page = Math.floor(tab.page * old / n); tab.sel.clear(); tab.dirty = true; }
    renderPane();
  };
  sel.onchange = () => finish(+sel.value);
  sel.onblur = () => finish(+sel.value);
  sel.onkeydown = e => { if (e.key === 'Escape') { e.preventDefault(); finish(null); } };
}

/* ---------- relations diagram: a small ERD above a table ----------
   The open table with what it points to (left), what points at it (right) and the other tables those
   point to (far right). Boxes list link and key columns first; "+ N more" opens a box to every column.
   Drag to pan, scroll to zoom, click a box to open its table. Copy and export always carry every column.
   Drawn like the ERD tab (curved wires, a dot at the referenced end); the whole schema is the ERD tab. */
/** Per tab, closed by default; tables opened from the ERD (or from this diagram) open with it showing. */
const relOn = tab => !!tab?.rel;
const REL = { W: 184, GAP: 96, HEAD: 24, ROW: 17, ROWS: 5, PER: 5, MAXH: 560 };
const relOpen = new Set();                                   // boxes opened past REL.ROWS, by table key
function relDraw(t, all) {
  const nodes = new Map();
  const add = (o, col) => { if (!nodes.has(o.key)) nodes.set(o.key, { t: o, col, links: new Set() }); return nodes.get(o.key); };
  const edges = [];
  add(t, 1);
  const parents = [...new Set(t.fks.map(f => f.ref))].filter(k => k !== t.key && S.byKey[k]).slice(0, REL.PER);
  for (const k of parents) add(S.byKey[k], 0);
  const children = S.tables.filter(o => o !== t && o.fks.some(f => f.ref === t.key)).slice(0, REL.PER);
  for (const o of children) add(o, 2);
  for (const o of children) for (const f of o.fks) if (!nodes.has(f.ref) && S.byKey[f.ref] && [...nodes.values()].filter(n => n.col === 3).length < REL.PER) add(S.byKey[f.ref], 3);
  for (const n of nodes.values()) for (const f of n.t.fks) {
    const p = nodes.get(f.ref);
    if (!p || p === n) continue;
    if (n.t !== t && p.t !== t && !(n.col === 2 && p.col === 3)) continue;   // only the wires the diagram is about
    n.links.add(f.cols[0]); p.links.add(f.refCols[0]);
    edges.push({ child: n, parent: p, f });
  }
  const selfFk = t.fks.find(f => f.ref === t.key);
  for (const n of nodes.values()) {
    const o = n.t, first = o.cols.filter(c => n.links.has(c.name) || c.pk);
    const ordered = [...first, ...o.cols.filter(c => !first.includes(c))];
    const room = Math.max(REL.ROWS, first.length);
    n.open = all || relOpen.has(o.key);
    n.rows = n.open ? ordered : ordered.slice(0, room);
    n.more = o.cols.length - n.rows.length;
    n.fewer = !all && n.open && o.cols.length > room;
    n.h = REL.HEAD + (n.rows.length + (n.more > 0 || n.fewer ? 1 : 0)) * REL.ROW + 4;
  }
  const cols = [0, 1, 2, 3].map(c => [...nodes.values()].filter(n => n.col === c)).filter(c => c.length);
  const colH = c => c.reduce((a, n) => a + n.h, 0) + (c.length - 1) * 18;
  const H = Math.max(...cols.map(colH));
  cols.forEach((c, i) => { let y = (H - colH(c)) / 2; for (const n of c) { n.x = i * (REL.W + REL.GAP); n.y = y; y += n.h + 18; } });
  const rowY = (n, name) => { const i = n.rows.findIndex(c => c.name === name); return n.y + REL.HEAD + Math.max(0, i) * REL.ROW + REL.ROW / 2 + 2; };
  // A column that links is marked FK here, even when it's also part of its table's primary key.
  const tag = (c, n) => c.fks?.length && n.links.has(c.name) ? fkMark(c) : c.pk ? 'PK' : c.fks?.length ? fkMark(c) : '';
  const clip = (s, n) => s.length > n ? s.slice(0, n - 1) + '…' : s;

    for (const fk of t.fks) {                                   // this row → the rows it references
      const ref = S.byKey[fk.ref], vs = fk.cols.map(valOf);
      if (!ref || vs.some(v => v == null)) continue;
      let res;
      try { res = await q(`select ${sel(ref)} from ${qt(ref)} where ${where(fk.refCols, vs)} limit 1`, [], true); }
      catch (e) { if (panel._token === token) fail(section(fk.ref, fkLabel(fk)), e); continue; }
      if (panel._token !== token) return;
      const body = section(fk.ref, `${fk.cols.join(', ')} → ${fk.refCols.join(', ')}`);
      const hit = res.rows[0];
      if (!hit) { body.append(h('div', { class: 'rp-note' }, 'No matching row — the key points at nothing.')); continue; }
      body.append(relItem(ref, hit, where(fk.refCols, vs), true));
    }
    for (const o of S.tables) for (const fk of o.fks) {         // rows elsewhere → this row
      if (fk.ref !== t.key) continue;
      const vs = fk.refCols.map(valOf);
      if (vs.some(v => v == null)) continue;
      let res;
      try { res = await q(`select ${sel(o)}, count(*) over ()::text from ${qt(o)} where ${where(fk.cols, vs)} limit 3`, [], true); }
      catch (e) { if (panel._token === token) fail(section(o.key, fkLabel(fk)), e); continue; }
      if (panel._token !== token) return;
      const n = +(res.rows[0]?.at(-1) ?? 0);
      if (!n) { empty.push(o.key); continue; }
      const body = section(o.key, `${n.toLocaleString()} ${n === 1 ? 'row' : 'rows'} · ${fk.cols.join(', ')}`);
      const opk = o.pk.map(p => o.cols.findIndex(c => c.name === p));
      body.append(h('div', { class: 'rp-list' },
        res.rows.map(x => relItem(o, x, opk.length && opk.every(i => i >= 0 && x[i] != null) ? where(o.pk, opk.map(i => x[i])) : where(fk.cols, vs))),
        n > res.rows.length && h('button', { class: 'rp-all', onclick: () => openTable(o.key, { view: 'rows', filter: where(fk.cols, vs) }) }, `All ${n.toLocaleString()} in ${o.key} →`)));
    }
    if (panel._token !== token) return;
    status.remove();
    if (empty.length) rel.append(h('div', { class: 'rp-note' }, `Nothing points here from ${empty.join(', ')}.`));
    if (!rel.children.length) rel.append(h('div', { class: 'rp-note' }, 'No foreign keys lead to or from this table.'));
  })();
}

/** A field of the focused row: click focuses its cell and copies the value; double-click edits it in place.
 *  The copy waits out the double-click window, and is skipped when you've dragged to select some of the text. */
function fieldDd(tab, t, r, i, v) {
  const c = t.cols[i], canEdit = t.editable && c.gen !== 's';
  const dd = h('dd', { class: (v == null ? 'null' : '') + (c.cat === 'N' ? ' n' : ''), 'data-c': i,
    title: (v != null && v.length > 120 ? v.slice(0, 600) + '\n\n' : '') + (canEdit ? 'Click to copy · double-click to edit' : 'Click to copy') }, v == null ? 'null' : String(v).slice(0, 400));
  let timer;
  dd.onclick = e => {
    if (dd.classList.contains('editing') || e.detail > 1) return;
    setFocus(tab, tab._wrap, r, i);
    if (String(getSelection() || '')) return;
    clearTimeout(timer);
    timer = setTimeout(() => { navigator.clipboard?.writeText(v ?? ''); toast(v == null ? 'Copied (null, as empty)' : `Copied ${c.name}`); }, 260);
  };
  dd.ondblclick = e => {
    clearTimeout(timer);
    getSelection()?.removeAllRanges();
    if (!canEdit) { if (t.editable) toast('Generated columns are computed — they can\'t be edited.', 'bad'); return; }
    if (dd.classList.contains('editing')) return;
    const input = h('textarea', { value: v ?? '', placeholder: v == null ? 'null' : '', spellcheck: false, rows: Math.min(8, Math.max(1, Math.ceil((v?.length || 0) / 32), (v?.split('\n').length || 1))) });
    const keep = [...dd.childNodes], cls = dd.className;
    dd.className = 'editing'; dd.replaceChildren(input);
    input.focus(); input.select();
    let done = false;
    const finish = async save => {
      if (done) return; done = true;
      const val = input.value;
      if (save && !(v == null && val === '') && val !== v) await updateCell(tab, t, r, i, val);
      if (dd.isConnected) { dd.className = cls; dd.replaceChildren(...keep); markFocusField(tab); }   // cancelled, or the update failed
    };
    input.onclick = input.ondblclick = e => e.stopPropagation();
    input.onkeydown = e => {
      e.stopPropagation();
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); finish(true); }
      else if (e.key === 'Escape') { e.preventDefault(); finish(false); }
    };
    input.onblur = () => finish(true);
  };
  return dd;
}
const markFocusField = tab => tab._panel?.querySelectorAll('.rp-fields dd[data-c]').forEach(dd => dd.classList.toggle('on', +dd.dataset.c === tab.focus?.c));

function gridKeys(e, tab, t, wrap) {
  if (e.target.tagName === 'INPUT') return;
  const f = tab.focus;
  const mv = { ArrowUp: [-1, 0], ArrowDown: [1, 0], ArrowLeft: [0, -1], ArrowRight: [0, 1] }[e.key];
  if (mv) { e.preventDefault(); setFocus(tab, wrap, (f?.r ?? 0) + (f ? mv[0] : 0), (f?.c ?? 0) + (f ? mv[1] : 0)); return; }
  if (!f) return;
  if (e.key === 'Tab') { e.preventDefault(); setFocus(tab, wrap, f.r, f.c + (e.shiftKey ? -1 : 1)); return; }
  if ((e.key === 'Enter' || e.key === 'F2') && t.editable) { e.preventDefault(); editCell(tab, t, f.r, f.c); return; }
  if ((e.ctrlKey || e.metaKey) && e.key === 'c') { navigator.clipboard?.writeText(tab.rows[f.r][f.c + 1] ?? ''); toast('Copied'); return; }
  if (e.key === ' ' && t.editable) { e.preventDefault(); toggleSel(tab, f.r); return; }
  if (e.key === 'Escape') { tab.sel.clear(); tab._draw(); return; }
  if (t.editable && e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) { e.preventDefault(); editCell(tab, t, f.r, f.c, e.key); }
}

function toggleSel(tab, r, range) {
  if (range && tab.lastSel != null) {
    const [a, b] = [Math.min(tab.lastSel, r), Math.max(tab.lastSel, r)];
    for (let i = a; i <= b; i++) tab.sel.add(i);
  } else tab.sel.has(r) ? tab.sel.delete(r) : tab.sel.add(r);
  tab.lastSel = r;
  renderPane();
}

function editCell(tab, t, r, c, initial) {
  const td = tab._wrap.querySelector(`td[data-r="${r}"][data-c="${c}"]`);
  if (!td || td.classList.contains('editing')) return;
  const col = t.cols[c];
  if (col.gen === 's') { toast('Generated columns are computed — they can\'t be edited.', 'bad'); return; }
  const old = tab.rows[r][c + 1];
  const input = h('input', { value: initial ?? old ?? '', placeholder: old == null ? 'null' : '', spellcheck: false });
  td.className = 'editing'; td.replaceChildren(input);
  input.focus();
  if (initial == null) input.select();
  let done = false;
  const finish = async (save, move) => {
    if (done) return; done = true;
    const val = input.value;
    if (save && !(old == null && val === '') && val !== old) await updateCell(tab, t, r, c, val);
    else tab._draw();
    if (move) setFocus(tab, tab._wrap, r + move[0], c + move[1]);
    else tab._wrap.focus({ preventScroll: true });
  };
  input.onkeydown = e => {
    if (e.key === 'Enter') { e.preventDefault(); finish(true, [1, 0]); }
    else if (e.key === 'Tab') { e.preventDefault(); finish(true, [0, e.shiftKey ? -1 : 1]); }
    else if (e.key === 'Escape') { e.preventDefault(); finish(false); }
  };
  input.onblur = () => finish(true);
}

/** Run grid-originated writes in one transaction; record the SQL in the journal; return results. */
/** What Undo can't put back exactly, in plain words ('' when it's a clean reversal). Undo is a new
 *  statement — delete ↔ insert, update → update back — not a rollback, so cascades and triggers show. */
function undoCaveat(t, op) {
  if (!t) return '';
  const list = l => l.length > 3 ? `${l.slice(0, 3).join(', ')} and ${l.length - 3} more` : l.join(', ');
  const out = [];
  if (op === 'delete') {
    const refs = S.tables.flatMap(o => o.fks.filter(f => f.ref === t.key).map(f => ({ o, rule: f.onDelete })));
    const cascade = [...new Set(refs.filter(x => x.rule === 'cascade').map(x => x.o.name))];
    const unlink = [...new Set(refs.filter(x => x.rule === 'set null' || x.rule === 'set default').map(x => x.o.name))];
    if (cascade.length) out.push(`Any rows in ${list(cascade)} that pointed to what you deleted were deleted too (ON DELETE CASCADE) — Undo won't bring those back.`);
    if (unlink.length) out.push(`Any rows in ${list(unlink)} that pointed to it were unlinked (ON DELETE SET NULL) — Undo won't relink them.`);
  }
  const n = t.triggers?.length || 0;
  if (n) out.push(`Undo ${op === 'delete' ? 're-inserts the rows' : op === 'insert' ? 'deletes the row' : 'writes the old value back'}, so ${t.name}'s trigger${n > 1 ? 's' : ''} (${list(t.triggers)}) run${n > 1 ? '' : 's'} again.`);
  return out.join(' ');
}
async function gridWrite(info, stmts, undoStmts) {
  const { label, t, op, col } = typeof info === 'string' ? { label: info } : info;
  if (!(await prodWriteOk(stmts.map(s => s.sql).join(';\n')))) return null; // @remote
  const t0 = performance.now();
  let results, joined;
  try {
    results = await appTransaction(async tx => {
      joined = tx.joined;
      const out = [];
      for (const s of stmts) out.push(await tx.query(s.sql, s.params || [], { rowMode: 'array' }));
      return out;
    });
  } catch (e) {
    journalAdd({ src: 'grid', sql: stmts.map(s => inlineParams(s.sql, s.params)).join(';\n'), error: e.message, ms: Math.round(performance.now() - t0) });
    toast(e.message, 'bad');
    return null;
  }
  const affected = results.reduce((a, r) => a + (r.affectedRows || 0), 0);
  journalAdd({ src: 'grid', sql: stmts.map(s => inlineParams(s.sql, s.params)).join(';\n'), info: plural(affected, 'row'), ms: Math.round(performance.now() - t0) });
  const undo = typeof undoStmts === 'function' ? undoStmts(results) : undoStmts;
  // Said after Undo runs: what it actually did.
  const done = n => op === 'delete' ? `Restored ${plural(n, 'row')} in ${t.name}` : op === 'update' ? `Set ${t.name}.${col} back` : op === 'insert' ? `Removed the row added to ${t.name}` : `Undid: ${label}`;
  if (undo) { S.undo.push({ label, stmts: undo, done }); if (S.undo.length > 50) S.undo.shift(); }
  const caveat = undo ? undoCaveat(t, op) : '';
  const note = [caveat, joined && 'It\'s part of your open transaction, so it\'s kept only when you commit.'].filter(Boolean).join(' ');
  toast(note ? `${label}. ${note}` : label, null, undo ? { label: 'Undo', run: undoLast } : null);
  return results;
}

async function undoLast() {
  const u = S.undo.at(-1);
  if (u && !(await prodWriteOk(u.stmts.map(s => s.sql).join(';\n')))) return; // @remote
  S.undo.pop();
  if (!u) { toast('Nothing to undo'); return; }
  const t0 = performance.now();
  try {
    const res = await appTransaction(async tx => { const out = []; for (const s of u.stmts) out.push(await tx.query(s.sql, s.params || [])); return out; });
    const n = res.reduce((a, r) => a + (r.affectedRows || 0), 0);
    journalAdd({ src: 'grid', sql: '-- undo\n' + u.stmts.map(s => inlineParams(s.sql, s.params)).join(';\n'), info: plural(n, 'row'), ms: Math.round(performance.now() - t0) });
    toast(n ? (u.done ? u.done(n) : `Undid: ${u.label}`) : `Couldn't undo "${u.label}" — the row has changed since.`, n ? null : 'bad');
  } catch (e) { toast('Undo failed: ' + e.message, 'bad'); }
  await afterWrite();
}

async function updateCell(tab, t, r, c, val) {
  const row = tab.rows[r], col = t.cols[c];
  const old = row[c + 1];
  const id = rowIdent(t, row, 2);
  const res = await gridWrite({ label: `Updated ${t.name}.${col.name}`, t, op: 'update', col: col.name },
    [{ sql: `update ${qt(t)} set ${qi(col.name)} = $1 where ${id.where} returning ${identReturn(t)}`, params: [val, ...id.params] }],
    ([r0]) => {
      const newIdent = r0.rows[0];
      if (!newIdent) return null;
      const w = t.pk.length ? t.pk.map((p, i) => `${qi(p)} = $${2 + i}`).join(' and ') : 'ctid = $2::tid';
      return [{ sql: `update ${qt(t)} set ${qi(col.name)} = $1 where ${w}`, params: [old, ...newIdent] }];
    });
  if (res) { tab.markRow = r; await afterWrite(); }
  else tab._draw();
}

async function setCellNull(tab, t, r, c) { await updateCell(tab, t, r, c, null); }

async function deleteSelected(tab) {
  const t = S.byKey[tab.key];
  const idxs = [...tab.sel].sort((a, b) => a - b);
  if (!idxs.length) return;
  if (!(await confirmDlg({ title: `Delete ${plural(idxs.length, 'row')}?`, body: `From ${t.key}.`, ok: 'Delete', danger: true }))) return;
  const insertable = t.cols.filter(c => c.gen !== 's');
  const overriding = t.cols.some(c => c.ident === 'a') ? ' overriding system value' : '';
  const stmts = [], undo = [];
  for (const r of idxs) {
    const row = tab.rows[r];
    const id = rowIdent(t, row, 1);
    stmts.push({ sql: `delete from ${qt(t)} where ${id.where}`, params: id.params });
    undo.push({ sql: `insert into ${qt(t)} (${insertable.map(c => qi(c.name)).join(', ')})${overriding} values (${insertable.map((_, i) => '$' + (i + 1)).join(', ')})`,
      params: insertable.map(c => row[t.cols.indexOf(c) + 1]) });
  }
  const res = await gridWrite({ label: `Deleted ${plural(idxs.length, 'row')} from ${t.name}`, t, op: 'delete' }, stmts, undo.reverse());
  if (res) { tab.sel.clear(); await afterWrite(); }
}

function startDraft(tab) {
  if (tab.view !== 'rows') tab.view = 'rows';
  tab.draft = {};
  tab._draw ? tab._draw() : renderPane();
  setTimeout(() => tab._wrap?.querySelector('tr.draft input')?.focus(), 0);
}
function draftRow(tab, t) {
  const save = async () => {
    const entries = t.cols.map((c, i) => [c, tab.draft[i]]).filter(([c, v]) => v != null && v !== '' && c.gen !== 's');
    const sql = entries.length
      ? `insert into ${qt(t)} (${entries.map(([c]) => qi(c.name)).join(', ')})${entries.some(([c]) => c.ident === 'a') ? ' overriding system value' : ''} values (${entries.map((_, i) => '$' + (i + 1)).join(', ')}) returning ${identReturn(t)}`
      : `insert into ${qt(t)} default values returning ${identReturn(t)}`;
    const res = await gridWrite({ label: `Added a row to ${t.name}`, t, op: 'insert' }, [{ sql, params: entries.map(([, v]) => v === '\\N' ? null : v) }], ([r0]) => {
      const ident = r0.rows[0];
      const w = t.pk.length ? t.pk.map((p, i) => `${qi(p)} = $${1 + i}`).join(' and ') : 'ctid = $1::tid';
      return [{ sql: `delete from ${qt(t)} where ${w}`, params: ident }];
    });
    if (res) {
      tab.draft = null;
      await afterWrite();
      // Find & mark the new row if it's on this page.
      const ident = res[0].rows[0];
      const idx = tab.rows.findIndex(row => t.pk.length ? t.pk.every((p, i) => row[t.cols.findIndex(c => c.name === p) + 1] === ident[i]) : row[0] === ident[0]);
      if (idx >= 0) { tab.markRow = idx; tab._draw(); }
    }
  };
  const cancel = () => { tab.draft = null; tab._draw(); };
  return h('tr', { class: 'draft' },
    h('td', { class: 'rn' }, h('button', { title: 'Save row (Enter)', style: 'color:var(--green);font-weight:700;padding:0 4px', onclick: save }, '✓'), h('button', { title: 'Cancel (Esc)', style: 'color:var(--red);padding:0 4px', onclick: cancel }, '✗')),
    t.cols.map((c, i) => h('td', {}, h('input', {
      value: tab.draft[i] ?? '', spellcheck: false, disabled: c.gen === 's',
      placeholder: c.gen === 's' ? 'generated' : c.def ? `default: ${c.def.replace(/::[\w ]+/g, '').slice(0, 24)}` : c.notnull ? 'required' : 'null',
      oninput: e => { tab.draft[i] = e.target.value; },
      onkeydown: e => { if (e.key === 'Enter') { e.preventDefault(); save(); } if (e.key === 'Escape') cancel(); } }))));
}

function cellMenu(tab, t, r, c, x, y) {
  const col = t.cols[c], v = tab.rows[r][c + 1];
  const items = [];
  if (t.editable) items.push({ label: 'Edit', hint: 'Enter', icon: 'pen', run: () => editCell(tab, t, r, c) });
  if (t.editable && !col.notnull && v != null) items.push({ label: 'Set to NULL', run: () => setCellNull(tab, t, r, c) });
  items.push({ label: 'Copy value', hint: 'Ctrl C', icon: 'copy', run: () => { navigator.clipboard?.writeText(v ?? ''); toast('Copied'); } });
  items.push('-');
  items.push({ label: v == null ? `Filter: ${col.name} is null` : `Filter: ${col.name} = ${String(v).slice(0, 24)}`, icon: 'filter', run: () => { tab.filter = v == null ? `${qi(col.name)} is null` : `${qi(col.name)} = ${lit(v)}`; tab.page = 0; tab.dirty = true; renderPane(); } });
  // Follow every key this column is part of — matching on ALL of the key's columns (tenant-safe for composites).
  const rowVal = name => tab.rows[r][t.cols.findIndex(c => c.name === name) + 1];
  const where = (cols, vals) => cols.map((c, i) => `${qi(c)} = ${lit(vals[i])}`).join(' and ');
  const shown = (cols, vals) => cols.map((c, i) => `${c} = ${String(vals[i]).slice(0, 16)}`).join(', ');
  for (const fk of col.fks || []) {
    const vals = fk.cols.map(rowVal);
    if (vals.some(x => x == null) || !S.byKey[fk.ref]) continue;
    items.push({ label: `Go to ${fk.ref} where ${shown(fk.refCols, vals)}`, icon: 'caret', run: () => openTable(fk.ref, { view: 'rows', filter: where(fk.refCols, vals) }) });
  }
  // Reverse references: rows elsewhere whose key points at this row.
  for (const other of S.tables) for (const fk of other.fks) {
    if (fk.ref !== t.key || !fk.refCols.includes(col.name)) continue;
    const vals = fk.refCols.map(rowVal);
    if (vals.some(x => x == null)) continue;
    items.push({ label: `Find in ${other.key} (${fk.cols.join(', ')})`, icon: 'search', run: () => openTable(other.key, { view: 'rows', filter: where(fk.cols, vals) }) });
  }
  items.push('-');
  if (t.editable) items.push({ label: tab.sel.has(r) ? 'Unselect row' : 'Select row', hint: 'Space', run: () => toggleSel(tab, r) });
  items.push({ label: 'Ask the Clerk about this row', icon: 'quill', run: () => {
    const obj = Object.fromEntries(t.cols.map((cc, i) => [cc.name, tab.rows[r][i + 1]]));
    clerkAsk(`About this row in ${t.key}: ${JSON.stringify(obj)} — `, { draft: true });
  } });
  if (t.editable) items.push({ label: 'Delete row', danger: true, icon: 'trash', run: () => { tab.sel = new Set([r]); deleteSelected(tab); } });
  showMenu(x, y, items);
}

/* ---------- structure view ---------- */
const COMMON_TYPES = ['text', 'integer', 'bigint', 'numeric', 'boolean', 'date', 'timestamptz', 'jsonb', 'uuid', 'serial', 'bigserial', 'real', 'double precision', 'varchar(255)', 'time', 'interval', 'bytea', 'text[]', 'integer[]'];

function tableDDL(t) {
  if (!t.editable) return null;
  const lines = t.cols.map(c => `  ${qi(c.name)} ${c.type}${c.ident === 'a' ? ' generated always as identity' : c.ident === 'd' ? ' generated by default as identity' : ''}${c.def && !c.ident && c.gen !== 's' ? ' default ' + c.def : ''}${c.gen === 's' ? ` generated always as (${c.def}) stored` : ''}${c.notnull ? ' not null' : ''}`);
  for (const k of t.cons.filter(k => k.type !== 'n')) lines.push(`  constraint ${qi(k.name)} ${k.def}`);
  return `create table ${qt(t)} (\n${lines.join(',\n')}\n);`;
}

async function renderStructure(tab, t, pane) {
  const body = h('div', { class: 'structure' });
  pane.append(body);
  const colsCard = h('div', { class: 'card' },
    h('h3', {}, 'Columns', h('span', { class: 'spacer' }), h('small', { class: 'smallcaps' }, plural(t.cols.length, 'column'))),
    h('table', { class: 'cols-table' },
      h('thead', {}, h('tr', {}, ['Name', 'Type', 'Keys', 'Default', ''].map(x => h('th', {}, x)))),
      h('tbody', {}, t.cols.map(c => h('tr', {},
        h('td', { style: 'font-weight:500' }, c.name),
        h('td', { class: 'ty' }, c.type),
        h('td', {}, c.pk && h('span', { class: 'badge pk' }, 'PK'), (c.fks || []).map(f => h('span', { class: 'badge fk', title: fkLabel(f) }, `→ ${f.ref}${f.cols.length > 1 ? ` (${f.cols.length} cols)` : ''}`)), c.notnull && !c.pk && h('span', { class: 'badge nn' }, 'NOT NULL')),
        h('td', { class: 'df', title: c.def || '' }, c.gen === 's' ? `= ${c.def}` : c.ident ? 'identity' : c.def || ''),
        h('td', { class: 'acts' }, t.editable && [
          h('button', { class: 'btn sm ghost', title: 'Rename column', onclick: () => renameColumn(t, c) }, ic('pen')),
          h('button', { class: 'btn sm ghost red', title: 'Drop column', onclick: () => dropColumn(t, c) }, ic('trash'))]))))));
  if (t.editable) {
    const nm = h('input', { class: 'field', placeholder: 'new_column' });
    const ty = h('input', { class: 'field', placeholder: 'type', value: 'text', list: 'typeList' });
    const nn = h('input', { type: 'checkbox' });
    const df = h('input', { class: 'field mono', placeholder: 'default (sql)' });
    const add = async () => {
      if (!nm.value.trim()) { nm.focus(); return; }
      const sql = `alter table ${qt(t)} add column ${qi(nm.value.trim())} ${ty.value.trim() || 'text'}${df.value.trim() ? ' default ' + df.value.trim() : ''}${nn.checked ? ' not null' : ''};`;
      if (await runDDL(sql, `Added column ${nm.value.trim()}`)) renderPane();

  }

  // go alone: in one string with other statements they'd be inside an implicit transaction.

function modal(content, { wide } = {}) {
  const bg = h('div', { class: 'modal-bg' });
  const box = h('div', { class: 'modal' + (wide ? ' wide' : '') }, content);
  bg.append(box);
  const close = () => { bg.remove(); document.removeEventListener('keydown', onKey, true); };
  const onKey = e => { if (e.key === 'Escape') { e.stopPropagation(); close(); bg.dispatchEvent(new Event('cancel')); } };
  document.addEventListener('keydown', onKey, true);
  bg.addEventListener('mousedown', e => { if (e.target === bg) { close(); bg.dispatchEvent(new Event('cancel')); } });
  document.body.append(bg);
  return { bg, box, close };
}

/** A dialog's status line, for its footer: what's happening, a thin bar, and under it the counts
 *  ("table 2 of 3 · 32,000 of ~85,000 rows"). While working (a bar is showing) the counts line keeps
 *  its place, so nothing shifts from step to step.
 *  set(text, { lead, done, total, unit, approx, note, frac, busy }): lead and note go either side of
 *  "done of total unit"; frac (0–1) sets the bar when the count isn't what it should follow; busy: a
 *  bar that just moves. fail(text) · set('') clears it. */
function modalStatus(text = '') {
  const t = h('span', { class: 'ms-text' }), n = h('span', { class: 'ms-count' }), fill = h('i');
  const bar = h('div', { class: 'ms-bar' }, fill);
  const el = h('div', { class: 'modal-status', role: 'status', 'aria-live': 'polite' }, t, bar, n);
  el.set = (text, { lead, done, total, unit, approx, note, frac, busy } = {}) => {
    el.classList.remove('bad');
    t.textContent = text || '';
    const known = total > 0 && done != null && done <= total;
    const count = done == null ? '' : known ? `${done.toLocaleString()} of ${approx ? '~' : ''}${plural(total, unit || 'item')}` : unit ? plural(done, unit) : done.toLocaleString();
    n.textContent = [lead, count, note].filter(Boolean).join(' · ');
    const f = frac ?? (known ? done / total : null);
    el.classList.toggle('progress', f != null || !!busy);
    bar.classList.toggle('busy', f == null && !!busy);
    fill.style.width = f != null ? `${Math.round(Math.min(1, f) * 100)}%` : '';
  };
  el.fail = text => { el.set(text); el.classList.add('bad'); };
  el.set(text);
  return el;
}

function importCsvDialog({ schema } = {}) {
  const file = h('input', { type: 'file', accept: '.csv,.tsv,.txt,text/csv', class: 'field', style: 'padding:4px' });
  const nameI = h('input', { class: 'field', placeholder: 'table name' });
  const sch = schemaPicker(schema);
  const target = nm => sch ? `${qi(sch.value)}.${qi(nm)}` : qi(nm);
  const header = h('input', { type: 'checkbox', checked: true });
  const prev = h('div');
  const status = modalStatus();
  let rows = null, cols = [];
  const build = () => {
    if (!rows) return;
    const hasHeader = header.checked;
    const hdr = hasHeader ? rows[0] : rows[0].map((_, i) => `column_${i + 1}`);
    const data = hasHeader ? rows.slice(1) : rows;
    const seen = new Set();
    cols = hdr.map((hname, i) => {
      let n = slug(hname); while (seen.has(n)) n += '_'; seen.add(n);
      return { name: n, type: inferType(data.slice(0, 500).map(r => r[i])) };
    });
    prev.replaceChildren(h('div', { class: 'csvprev' }, h('table', {},
      h('thead', {}, h('tr', {}, cols.map(c => h('th', {},
        h('input', { class: 'field', value: c.name, oninput: e => c.name = e.target.value }), h('br'),
        h('select', { class: 'field', onchange: e => c.type = e.target.value }, ['text', 'integer', 'bigint', 'numeric', 'boolean', 'date', 'timestamptz', 'jsonb'].map(t => h('option', { value: t, selected: t === c.type }, t))))))),
      h('tbody', {}, data.slice(0, 8).map(r => h('tr', {}, cols.map((_, i) => h('td', {}, r[i] ?? ''))))))));
    status.set(`${plural(data.length, 'row')} · ${plural(cols.length, 'column')}`);
  };
  file.onchange = async () => {
    const f = file.files[0]; if (!f) return;
    rows = parseCsv(await f.text());
    if (!nameI.value) nameI.value = slug(f.name.replace(/\.\w+$/, ''));
    build();
  };
  header.onchange = build;
  const go = h('button', { class: 'btn ink' }, 'Import');
  go.onclick = async () => {
    if (!rows?.length) { file.click(); return; }
    const tname = slug(nameI.value);
    if (!(await prodWriteOk(`create table ${target(tname)} … -- and insert ${plural(rows.length - (header.checked ? 1 : 0), 'row')} from CSV`))) return; // @remote
    const data = header.checked ? rows.slice(1) : rows;
    go.disabled = true; status.set('Creating the table…', { busy: true });
    const t0 = performance.now();
    try {
      await appTransaction(async tx => {
        const ddl = `create table ${target(tname)} (\n${cols.map(c => `  ${qi(c.name)} ${c.type}`).join(',\n')}\n)`;
        await tx.exec(ddl);
        const B = Math.max(1, Math.floor(20000 / cols.length));
        for (let i = 0; i < data.length; i += B) {
          const chunk = data.slice(i, i + B);
          const params = [];
          const vals = chunk.map(r => '(' + cols.map((c, j) => {
            let v = r[j]; if (v === '' || v == null) v = null;
            else if (c.type === 'boolean') v = /^(t|true|yes|1)$/i.test(v) ? 'true' : 'false';
            params.push(v); return `$${params.length}::${c.type}`;
          }).join(', ') + ')').join(', ');
          await tx.query(`insert into ${target(tname)} values ${vals}`, params);
          status.set('Loading rows', { done: Math.min(i + B, data.length), total: data.length, unit: 'row' });
        }
        journalAdd({ src: 'grid', sql: `${ddl};\n-- + ${plural(data.length, 'row')} from CSV`, info: plural(data.length, 'row'), ms: Math.round(performance.now() - t0) });
      });
      m.close();
      const key = tableKey(sch?.value ?? curSchema(), tname);
      toast(`Imported ${plural(data.length, 'row')} into ${key}`);
      await afterWrite();
      openTable(key);
    } catch (e) { status.fail(e.message); go.disabled = false; }
  };
  const m = modal([
    h('div', { class: 'modal-h' }, h('h2', {}, 'Import a CSV'), h('p', {}, 'Creates a new table. Column types are guessed from the data — adjust them before loading. Empty cells become NULL.')),
    h('div', { class: 'modal-b' }, file, h('div', { style: 'display:flex;gap:10px;align-items:flex-end' }, sch && h('label', { class: 'lab' }, 'Schema', sch), h('label', { class: 'lab', style: 'flex:1' }, 'Table name', nameI), h('label', { style: 'display:flex;gap:6px;align-items:center;font-size:12.5px;height:32px' }, header, 'First row is a header')), prev),
    h('div', { class: 'modal-f' }, status, h('span', { class: 'spacer' }), h('button', { class: 'btn ghost', onclick: () => m.close() }, 'Cancel'), go)], { wide: true });
  file.click();
}

/* The ERD can show one schema at a time, for as long as its tab is open. Everything it draws or exports —
   cards, wires, SVG/PNG, Mermaid/DBML/text — goes through erdTables(), so they always agree. */
const allSchemas = () => [...new Set(S.tables.map(t => t.schema))].sort((a, b) => (a !== 'public') - (b !== 'public') || a.localeCompare(b));
/** The schemas the ERD is limited to, among those that still exist; [] means all of them. */
const erdSchemas = () => {
  const all = allSchemas(), picked = (S.tabs.find(t => t.type === 'map')?.schemas || []).filter(sc => all.includes(sc));
  return picked.length === all.length ? [] : picked;
};
const erdTables = () => { const sc = erdSchemas(); return sc.length ? S.tables.filter(t => sc.includes(t.schema)) : S.tables; };
/** "public" · "public, auth" · "4 schemas" — '' when the ERD shows everything. */
const erdScope = () => { const sc = erdSchemas(); return sc.length > 3 ? `${sc.length} schemas` : sc.join(', '); };

function erdText(kind, tables = erdTables()) {

  if (kind === 'mermaid') {

    const ty = c => c.type.replace(/[^\w\[\]]+/g, '_').replace(/_+$/, '');   // numeric(8,2) → numeric_8_2

        const keys = [c.pk && 'PK', c.fks?.length && 'FK', !c.pk && uniques(t).some(u => u.length === 1 && u[0] === c.name) && 'UK'].filter(Boolean);
        out.push(`        ${ty(c)} ${c.name.replace(/[^\w-]/g, '_')}${keys.length ? ' ' + keys.join(', ') : ''}${c.fks?.length > 1 ? ` "in ${c.fks.length} keys"` : ''}`);
      }
      out.push('    }');
    }
    for (const t of tables) for (const f of t.fks) {
      const rt = S.byKey[f.ref]; if (!rt || !tables.includes(rt)) continue;
      const required = f.cols.every(c => t.cols.find(x => x.name === c)?.notnull);
      const one = isUnique(t, f.cols);
      // parent side: exactly one if the key is required, else zero-or-one; child side: one (1:1) or many
      out.push(`    ${id(rt)} ${required ? '||' : '|o'}--${one ? 'o|' : 'o{'} ${id(t)} : "${f.cols.join(', ')}${f.cols.length > 1 ? ` → ${f.refCols.join(', ')}` : ''}"`);
    }

    const ty = c => /^[\w\[\]]+$/.test(c.type) ? c.type : `"${c.type}"`;
    const out = [`// ${stamp}`, ''];
    for (const t of tables) {
      out.push(`Table ${tn(t)} {`);
      for (const c of t.cols) {
        const st = [t.pk.length === 1 && c.pk && 'pk', c.notnull && !c.pk && 'not null', uniques(t).some(u => u.length === 1 && u[0] === c.name) && 'unique',
          c.def && !/^nextval\(/.test(c.def) && `default: \`${c.def}\``, /^nextval\(/.test(c.def || '') && 'increment'].filter(Boolean);
        out.push(`  ${q(c.name)} ${ty(c)}${st.length ? ` [${st.join(', ')}]` : ''}`);

      if (multi.length) { out.push('', '  Indexes {'); for (const [cols, kindName] of multi) out.push(`    (${cols.map(q).join(', ')}) [${kindName}]`); out.push('  }'); }
      if (t.kind === 'v' || t.kind === 'm') out.push(`  Note: '${t.kind === 'v' ? 'view' : 'materialized view'}'`);
      out.push('}', '');
    }
    for (const t of tables) for (const f of t.fks) {
      const rt = S.byKey[f.ref]; if (!rt || !tables.includes(rt)) continue;
      const one = isUnique(t, f.cols);
      const cols = cs => cs.length > 1 ? `(${cs.map(q).join(', ')})` : q(cs[0]);
      const opt = f.onDelete && f.onDelete !== 'no action' ? ` [delete: ${f.onDelete}]` : '';

    }

  for (const t of tables) {
    out.push(`${t.key}${t.kind === 'v' ? ' (view)' : t.kind === 'm' ? ' (materialized view)' : ` — ${plural(S.counts[t.key] ?? 0, 'row')}`}`);
    const w = Math.max(...t.cols.map(c => c.name.length));
    for (const c of t.cols) {
      const tags = [c.pk && 'PK', c.notnull && !c.pk && 'not null', c.def && `default ${c.def}`].filter(Boolean);
      out.push(`  ${c.name.padEnd(w)}  ${c.type}${tags.length ? '  · ' + tags.join(' · ') : ''}`);

    for (const u of uniques(t)) out.push(`  unique (${u.join(', ')})`);
    for (const f of t.fks) out.push(`  FK ${fkLabel(f)}`);
    out.push('');
  }

async function sqlDump(id) {

  const args = ['--inserts', '--rows-per-insert=1000', '--no-owner', '--no-privileges'];

    // session options (search_path = '' etc.). Close and reset both, or later edits would sit in an
    // uncommitted transaction and the next dump would fail — then put back the user's own SETs.
    // Not with a transaction of the user's open: that ROLLBACK would throw their work away.
    if (txState() !== 'I') throw new Error('A transaction is open (BEGIN) — commit or roll it back first, then dump.');
    const mine = (await S.db.query(`select name, setting from pg_settings where source = 'session'`)).rows;

/** Run a plain-SQL dump. Handles pg_dump's COPY … FROM stdin blocks and skips psql meta-commands (\restrict, \connect…).
 *  onProgress(table, done, total) before each COPY block's data. */
async function runSqlScript(pg, sql, onProgress) {
  const meta = /^\\[a-z].*$/gim;
  const copyRe = /^COPY\s+(.+?)\s+FROM\s+stdin;[ \t]*\r?$/gim;
  const total = sql.match(copyRe)?.length || 0;

  while ((m = copyRe.exec(sql))) {
    const before = sql.slice(pos, m.index).replace(meta, '');
    if (before.trim()) await pg.exec(before);
    const start = sql.indexOf('\n', m.index) + 1;
    let end = sql.indexOf('\n\\.', start - 1);
    if (end < 0) end = sql.length;
    onProgress?.(m[1].replace(/\s*\(.*$/s, ''), done++, total);   // the table, without COPY's column list
    for (const ins of copyInserts(m[1], sql.slice(start, end))) await pg.exec(ins.sql);
    pos = end + 3;
    copyRe.lastIndex = pos;
  }
  const rest = sql.slice(pos).replace(meta, '');
  if (rest.trim()) await pg.exec(rest);
  await pg.exec('RESET ALL');          // the dump sets search_path='' etc. for its session
}

async function readSession(file) {
  const buf = new Uint8Array(await file.arrayBuffer());
  if (buf[0] !== 0x1f || buf[1] !== 0x8b) throw new Error('That isn\'t a .pgquire session file.');
  return readTarSession(await gunzip(buf));
}

/** Read a tar session into the shape the import dialog uses. */
function readTarSession(tarBytes) {
  const entries = tarUnpack(tarBytes);
  const text = p => entries.has(p) ? new TextDecoder().decode(entries.get(p)) : null;
  const jsonAt = p => { const t = text(p); return t == null ? null : JSON.parse(t); };
  const manifest = jsonAt('manifest.json');
  if (manifest?.format !== SESSION_FORMAT) throw new Error('No pgquire manifest.json in this archive.');
  if (manifest.version > 3) throw new Error('This session was made by a newer pgquire.');
  let settings = manifest.settings ? jsonAt('settings.json') : null;
  if (settings && !Object.keys(settings).length) settings = null;
  const databases = manifest.databases.map(d => {
    const bytes = entries.get(d.dir + d.data);
    if (!bytes) throw new Error(`Missing ${d.dir + d.data} in the archive.`);
    const state = {};
    for (const [key, fname] of Object.entries(STATE_FILES)) { const v = jsonAt(d.dir + fname); if (v != null) state[key] = v; }
    const ws = jsonAt(d.dir + 'workspace.json');
    if (ws?.tabs) state.tabs = ws.tabs;
    if (ws?.map) state.map = ws.map;
    const sql = /\.sql$/.test(d.data);
    return { name: d.name, created: d.created, extensions: d.extensions || [], hue: d.hue ?? (d.color != null ? OLD_HUES[d.color % OLD_HUES.length] : undefined), data: { kind: sql ? 'sql' : 'datadir', length: bytes.length }, state,
      ...(sql ? { sqlText: new TextDecoder().decode(bytes) } : { blob: new Blob([bytes]) }) };
  });
  return { ...manifest, settings, databases };
}

/* ---------- export / import ---------- */
const CONV_FORMAT = 'pgquire-conversations';

function convToMarkdown(c) {
  const lines = [`# ${c.title}`, '', `*pgquire · database “${currentDb()?.name}” · ${C.model} · started ${new Date(c.created).toLocaleString()}*`];
  if (c.usage?.calls) lines.push('', `*${c.usage.calls} model calls · ${c.usage.in.toLocaleString()} input + ${c.usage.out.toLocaleString()} output tokens · ${fmtCost(c.usage)}*`);
  for (const it of c.items) {
    const t = it.ts ? ` · ${new Date(it.ts).toLocaleString()}` : '';
    lines.push('');
    if (it.k === 'user') {
      lines.push(`## You${t}`, '', it.text);
      const att = [...(it.attached || []).map(k => `table \`${k}\``), ...(it.attachedQ || []).map(k => `query “${k}”`)];
      if (att.length) lines.push('', `*Attached: ${att.join(', ')}*`);
    } else if (it.k === 'ai') {
      lines.push(`### The Clerk${t}${it.model ? ` · ${it.model}` : ''}${it.ms != null ? ` · ${fmtMs(it.ms)}` : ''}${it.tin != null ? ` · ${it.tin} → ${it.tout} tokens` : ''}`, '', it.text);
    } else if (it.k === 'sql') {
      const status = { applied: 'APPROVED & applied', rejected: 'DECLINED', error: 'failed', ran: 'ran', pending: 'pending' }[it.status] || it.status;
      lines.push(`**${it.write ? 'Proposed change' : 'Query'}** — ${status}${it.ms != null ? ` · ${it.ms} ms` : ''}`, '', '```sql', it.sql, '```');
      if (it.error) lines.push('', `> Error: ${it.error}`);
      else if (it.preview?.fields?.length) {
        lines.push('', `| ${it.preview.fields.join(' | ')} |`, `|${it.preview.fields.map(() => '---').join('|')}|`,
          ...it.preview.rows.map(r => `| ${r.map(v => v == null ? '*null*' : String(v).replace(/\|/g, '\\|').replace(/\n/g, ' ')).join(' | ')} |`));
        if (it.summary) lines.push('', `*${it.summary}*`);
      } else if (it.summary) lines.push('', `*${it.summary}*`);
    } else if (it.k === 'note') lines.push(`*— ${it.text}*`);
    else if (it.k === 'err') lines.push(`> **Error:** ${it.text}`);
    else if (it.k === 'turn') lines.push(`*${it.calls} calls · ${fmtMs(it.ms)} · ${it.in} in / ${it.out} out · ${fmtCost(it)}*`);

  if (kind === 'md') {

  } else {

      conversations: list.map(c => ({ ...c, items: c.items.map(strip), convo: convoCache.get(c.id) || c.convo || null })) };

/* ---------- usage & cost ---------- */
const fmtTok = n => n >= 1e6 ? (n / 1e6).toFixed(2) + 'M' : n >= 1e4 ? Math.round(n / 1e3) + 'k' : n >= 1e3 ? (n / 1e3).toFixed(1) + 'k' : String(n);

}

function usageOf(data, ms) {
  const u = data.usage || {};

  let cost = typeof u.cost === 'number' ? u.cost : null;
  if (cost == null) { const p = C.pricing[`${C.base}|${C.model}`]; if (p) cost = tin * p.in + tout * p.out; }

const KEEP_FULL_TURNS = 3, OLD_TOOL_CHARS = 1500, OLD_USER_CHARS = 4000;

  if (conv?.ctxMode === 'full') return { msgs, compacted: 0, mode: 'full' };
  const turns = msgs.map((m, i) => m.role === 'user' ? i : -1).filter(i => i >= 0);
  const cut = turns.length > KEEP_FULL_TURNS ? turns[turns.length - KEEP_FULL_TURNS] : 0;
  let compacted = 0;
  const out = msgs.map((m, i) => {
    if (i >= cut || typeof m.content !== 'string') return m;
    if (m.role === 'tool' && m.content.length > OLD_TOOL_CHARS) { compacted++; return { ...m, content: `${m.content.slice(0, OLD_TOOL_CHARS)}\n…(truncated from ${m.content.length.toLocaleString()} characters — re-run the query if you need the rest)` }; }

    return m;

function describeView() {

    return {

      text: `The user is viewing the ${t.kind === 'v' ? 'view' : 'table'} ${t.key} (${tab.view} view)${tab.filter ? `, filtered by WHERE ${tab.filter}` : ''}${tab.sort ? `, sorted by ${tab.sort.col} ${tab.sort.dir}` : ''}, page ${tab.page + 1}, ${tab.total} matching rows. ${f}${sel.length ? `\nSelected rows: ${JSON.stringify(sel).slice(0, 4000)}` : ''}`,

}

const queryTabs = () => S.tabs.filter(t => t.type === 'query');

}
function attachPicker(e) {
  const r = e.currentTarget.getBoundingClientRect();

  const pick = (checked, on, label, hint) => h('label', { class: 'pick' }, h('input', { type: 'checkbox', checked, onchange: ev => { on(ev.target.checked); renderAttachChips(); } }), label, h('small', {}, hint));
  const box = h('div', {},

    S.tables.map(t => pick(C.attach.has(t.key), v => v ? C.attach.add(t.key) : C.attach.delete(t.key), t.key, t.kind === 'v' ? 'view' : (S.counts[t.key] ?? 0).toLocaleString())),

}
function describeAttachedQueries(tabs) {
  return tabs.map(t => {
    let res = 'Not run yet.';
    if (t.error) res = `Last run failed: ${t.error}`;
    else if (t.results) res = t.results.map((r, i) => `result ${i + 1}: ` + (r.fields.length
      ? `${r.rows.length} rows, columns ${JSON.stringify(r.fields.map(f => f.name))}\n${r.rows.slice(0, 20).map(x => JSON.stringify(x)).join('\n')}${r.rows.length > 20 ? '\n…' : ''}`
      : r.affected != null ? `${r.affected} rows affected` : 'ok')).join('\n');
    return `query tab "${t.title}":\n${t.sql.trim() || '(empty)'}\n${res}`;
  }).join('\n\n');
}
async function describeAttached(keys) {
  const parts = [];
  for (const k of keys) {
    const t = S.byKey[k]; if (!t) continue;
    let sample = '';
    try {
      const r = await q(`select ${t.cols.map(c => `${qi(c.name)}::text`).join(', ')} from ${qt(t)} limit 15`, [], true);
      sample = r.rows.map(row => JSON.stringify(row)).join('\n');
    } catch (e) { sample = `(could not read: ${e.message})`; }
    parts.push(`${t.kind === 'v' ? 'view' : 'table'} ${t.key}${t.kind !== 'v' ? ` — ${S.counts[t.key] ?? 0} rows` : ''}\ncolumns: ${t.cols.map(c => `${c.name} ${c.type}${c.pk ? ' PK' : ''}`).join(', ')}\n${t.cons.filter(c => c.type !== 'n').map(c => `constraint: ${c.def}`).join('\n')}\nfirst rows (${JSON.stringify(t.cols.map(c => c.name))}):\n${sample}`);
  }
  return parts.join('\n\n');
}

/* ---------- next-request size ----------
   Estimated from the exact payload pgquire would send now (system prompt with schema + view, tool
   definitions, the history in the selected mode, and the draft), converted to tokens with a
   characters-per-token ratio learned from the connected model's own reported counts. */
const tokRatio = () => store.get(`tokRatio:${C.model}`, null) || 1 / 3.6;
function contextEstimate(mode) {
  const conv = curConv();
  const r = tokRatio();
  const sys = systemPrompt().length, tools = JSON.stringify(TOOLS).length;
  // Include the message about to be sent: it starts a new turn, which can push an older one into compaction.
  const draftText = $('clerkText')?.value || '';
  const next = contextFor({ ctxMode: mode }, [...(C.convo || []), { role: 'user', content: draftText }]).msgs;
  const hist = JSON.stringify(next.slice(0, -1)).length;
  const draft = JSON.stringify(next.at(-1)).length;
  const tok = n => Math.round(n * r);
  return { total: tok(sys + tools + hist + draft), sys: tok(sys), tools: tok(tools), hist: tok(hist), draft: tok(draft), turns: (C.convo || []).filter(m => m.role === 'user').length };
}
function renderCtxSize() {
  const el = $('ctxSize'); if (!el || !clerkOn()) { if (el) el.textContent = ''; return; }
  const mode = curConv()?.ctxMode === 'full' ? 'full' : 'compact';
  const e = contextEstimate(mode), other = contextEstimate(mode === 'full' ? 'compact' : 'full');
  el.textContent = `≈${fmtTok(e.total)}`;
  el.classList.toggle('big', e.total > 60000);
  el.title = `Estimated size of the next request (${mode}):\n`
    + `  system prompt (instructions, schema, current view)  ${fmtTok(e.sys)}\n`
    + `  tool definitions  ${fmtTok(e.tools)}\n`
    + `  history — ${plural(e.turns, 'turn')}  ${fmtTok(e.hist)}\n`
    + `  your message  ${fmtTok(e.draft)}\n`
    + `\n${mode === 'full' ? 'Compact' : 'Full'} would be ≈${fmtTok(other.total)}.`
    + `\n${store.get(`tokRatio:${C.model}`, null) ? `Calibrated from ${C.model.split('/').pop()}'s reported token counts.` : 'Rough until the first reply calibrates it for this model.'}`;
}
