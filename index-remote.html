/** Right-click in the Clerk's log: what's under the pointer — selected text, a code block, a query card, a message — else
 *  the conversation. The message box keeps the browser's menu (spellcheck, paste). */
function clerkMenu(e) {
  e.preventDefault();
  const quote = text => { const ta = $('clerkText'); if (!ta) return; ta.value = `> ${text.trim().replace(/\n/g, '\n> ')}\n\n${ta.value}`; ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); ta.dispatchEvent(new Event('input')); };
  const cb = e.target.closest('.codeblock'), card = e.target.closest('.receipt'), msg = e.target.closest('.c-ai, .c-user-wrap');
  const target = cb || card || (msg && (msg.querySelector('.c-user') || msg));
  const copy = (text, what = 'Copied', el = target) => { navigator.clipboard?.writeText(text); toast(what); el && flashCopied(el); };
  const sqlItems = sql => [
    { label: 'Copy SQL', icon: 'copy', run: () => copy(sql, 'SQL copied') },
    { label: 'Open in editor', icon: 'query', run: () => openQuery(sql, { title: `Clerk ${hms(Date.now())}` }) }];
  const sel = getSelection()?.toString() || '';
  const at = sel.trim() ? [
    { label: 'Copy', icon: 'copy', hint: 'Ctrl C', run: () => copy(sel, 'Copied', null) },
    { label: 'Ask about this', icon: 'quill', run: () => quote(sel) }] : [];
  if (cb) {
    const code = cb.querySelector('code')?.textContent || '';
    if (!cb.dataset.lang || /sql/i.test(cb.dataset.lang)) at.push(at.length && '-', ...sqlItems(code));
    else at.push(at.length && '-', { label: 'Copy code', icon: 'copy', run: () => copy(code) });
  } else if (card?._sql) at.push(at.length && '-', ...sqlItems(card._sql));
  else if (msg?._it) {
    const it = msg._it, mine = it.k === 'user';
    at.push(at.length && '-',
      { label: mine ? 'Copy question' : 'Copy text', icon: 'copy', run: () => copy(mine ? it.text : msg.querySelector(':scope > div:last-child')?.innerText || it.text) },
      !mine && { label: 'Copy as Markdown', icon: 'copy', run: () => copy(it.text) },
      mine ? { label: 'Ask again, edited', icon: 'pen', run: () => { const ta = $('clerkText'); if (!ta) return; ta.value = it.text; ta.focus(); ta.dispatchEvent(new Event('input')); } }
        : { label: 'Ask a follow-up', icon: 'quill', run: () => {
            if (C.items.findLast(x => x.k === 'ai') === it) { const ta = $('clerkText'); ta?.focus(); return; }   // the latest reply needs no pointer
            const plain = it.text.replace(/```[\s\S]*?```/g, ' ').replace(/[#*_`>|]/g, '').replace(/\s+/g, ' ').trim();
            const first = plain.match(/^.*?[.!?](?=\s|$)/)?.[0] || plain;
            quote(`Re: “${first.length > 120 ? first.slice(0, 120).trimEnd() + '…' : first}”`);
          } });
  }
  if (!at.length || !(cb || card || msg)) at.push(at.length && '-',
    { label: 'New conversation', icon: 'plus', run: startNewConv },
    { label: 'Switch conversation…', disabled: C.convs.length < 2, run: () => convMenu({ currentTarget: document.querySelector('.conv-switch') }) },
    { label: 'Connection', icon: 'key', run: () => { C.showConnect = true; renderClerk(); } },
    { label: 'Close the Clerk', icon: 'x', hint: 'Ctrl J', run: toggleClerk });
  const mark = !sel.trim() && (cb || card || msg) && target;   // a selection already shows what's meant
  mark?.classList.add('ctx-target');
  showMenu(e.clientX, e.clientY, at, () => mark?.classList.remove('ctx-target'));
}

function connectForm() {
  const base = h('input', { class: 'field mono', value: C.base, list: 'baseList', spellcheck: false });
  const key = h('input', { class: 'field mono', type: 'password', value: C.key || '', placeholder: 'sk-… (optional for local servers)', spellcheck: false });
  const model = h('input', { class: 'field mono', value: C.model, list: 'modelList', spellcheck: false });
  const msg = h('div', { class: 'msg' });
  const go = h('button', { class: 'btn blue', style: 'justify-content:center;height:34px' }, ic('key'), clerkOn() ? 'Update connection' : 'Connect');
  const reload = () => loadModels(normBase(base.value || DEFAULT_BASE), key.value.trim());
  base.onchange = reload; key.onchange = reload;
  const submit = async () => {
    const url = normBase(base.value || DEFAULT_BASE), k = key.value.trim(), m = model.value.trim() || DEFAULT_MODEL;
    const bad = t => { msg.textContent = t; msg.className = 'msg bad'; };
    try { if (!/^https?:$/.test(new URL(url).protocol)) throw 0; } catch { return bad('That isn\'t a valid http(s) URL.'); }
    if (!k && isOpenRouter(url)) return bad('OpenRouter needs a key.');
    go.disabled = true; msg.className = 'msg'; msg.textContent = 'Checking…';
    try {
      let r;
      try { r = await fetch(isOpenRouter(url) ? `${url}/key` : `${url}/models`, { headers: authHeaders(k) }); }
      catch { throw new Error(`Couldn't reach ${url}. Check the URL, and that the server allows browser (CORS) requests.`); }
      if (r.status === 401 || r.status === 403) throw new Error('That key was rejected.');
      if (!r.ok && isOpenRouter(url)) throw new Error(`Key check failed (HTTP ${r.status}).`);
      C.base = url; C.key = k; C.model = m; C.showConnect = false;
      store.set('base', url); store.set('model', m);           // URL + model persist; the key never does
      renderClerk(); $('clerkText')?.focus();
      if (C.pending) { const p = C.pending; C.pending = null; clerkSend(p); }
    } catch (e) { bad(e.message); } finally { go.disabled = false; }
  };
  go.onclick = submit;
  [base, key, model].forEach(i => i.onkeydown = e => { if (e.key === 'Enter') submit(); });
  loadModels(C.base, C.key);
  setTimeout(() => { if (!app.classList.contains('clerk-closed')) (C.key == null ? key : model).focus({ preventScroll: true }); }, 50);   // a closed Clerk must not take focus: it scrolls the app sideways
  return h('div', { class: 'connect' },
    h('h3', {}, clerkOn() ? 'Connection' : 'Hire a clerk.'),
    h('p', {}, 'The Clerk is an AI that can read, query and change this database. Each change it wants to make shows up for you to approve first. It\'s optional; everything else works without it.'),
    h('label', {}, 'Endpoint (OpenAI-compatible)', base),
    h('label', {}, 'API key', key),
    h('label', {}, 'Model', model),
    promptEditor(),
    go, msg,
    h('div', { class: 'fine' }, 'The key stays in this tab\'s memory only — never saved, gone on reload, sent only to the endpoint above. The endpoint and model are remembered.'),
    h('div', { style: 'display:flex;gap:6px;flex-wrap:wrap' },
      (clerkOn() || store.get('clerkBrowse', false))
        ? h('button', { class: 'btn ghost sm', onclick: () => { C.showConnect = false; renderClerk(); } }, 'Back to conversations')
        : h('button', { class: 'btn sm', title: 'Read, switch, export and share your conversations; connect whenever you want to ask something', onclick: () => { store.set('clerkBrowse', true); C.showConnect = false; renderClerk(); } }, 'Browse chats without connecting'),
      !clerkOn() && h('button', { class: 'btn ghost sm', onclick: toggleClerk }, 'Not now')));
}

let modelsFor = null;
async function loadModels(url, key) {
  const tag = url + '|' + (key || '');
  if (modelsFor === tag) return;
  modelsFor = tag;
  try {
    const { data } = await (await fetch(`${url}/models`, { headers: authHeaders(key) })).json();
    for (const m of data || []) if (m.pricing && m.pricing.prompt != null) C.pricing[`${url}|${m.id}`] = { in: +m.pricing.prompt || 0, out: +m.pricing.completion || 0 };
    const opts = (data || []).filter(m => !m.supported_parameters || m.supported_parameters.includes('tools')).filter(m => !m.id.endsWith(':batch'))
      .sort((a, b) => a.id.localeCompare(b.id)).map(m => h('option', { value: m.id }, m.name || m.id));
    if (modelsFor === tag) $('modelList').replaceChildren(...opts);
  } catch { if (modelsFor === tag) { modelsFor = null; $('modelList').replaceChildren(); } }
}

async function callModel(messages, signal) {
  const t0 = performance.now();
  const res = await fetch(`${C.base}/chat/completions`, {
    method: 'POST', signal,
    headers: { ...authHeaders(C.key), 'Content-Type': 'application/json', ...(isOpenRouter(C.base) ? { 'X-Title': 'pgquire' } : {}) },
    // OpenRouter reports the exact cost when asked; other servers still return token counts.
    body: JSON.stringify({ model: C.model, messages, tools: TOOLS, tool_choice: 'auto', ...(isOpenRouter(C.base) ? { usage: { include: true } } : {}) }),
  });
  const ms = Math.round(performance.now() - t0);
  const data = await res.json().catch(() => ({}));
  if (!res.ok || data.error) {
    const msg = data.error?.message || (typeof data.error === 'string' && data.error) || `HTTP ${res.status}`;
    const e = new Error(res.status === 401 ? `The endpoint rejected the key (${msg}).` : msg);
    e.badKey = res.status === 401;
    throw e;
  }
  const m = data.choices?.[0]?.message;
  if (!m) throw new Error('The model returned nothing.');
  return { msg: m, usage: { ...usageOf(data, ms), model: data.model || C.model } };
}

async function clerkSend(text) {
  if (C.busy || !clerkOn()) return;
  const ta = $('clerkText'); if (ta) { ta.value = ''; ta.style.height = 'auto'; }
  const conv = curConv();
  const attached = [...C.attach].filter(k => S.byKey[k]);
  const attachedQ = [...C.attachQ].map(id => queryTabs().find(t => t.id === id)).filter(Boolean);
  C.attach.clear(); C.attachQ.clear();
  if (conv.title === 'New conversation') conv.title = text.replace(/\s+/g, ' ').slice(0, 60);
  C.busy = true; C.stop = false; C.abort = new AbortController();
  C.items.push({ k: 'user', text, ts: Date.now(), ...(attached.length ? { attached } : {}), ...(attachedQ.length ? { attachedQ: attachedQ.map(t => t.title) } : {}) }); saveClerk();
  renderClerk();
  let content = text;
  if (attached.length) content += `\n\n[Attached tables — schema and first rows]\n${await describeAttached(attached)}`;
  if (attachedQ.length) content += `\n\n[Attached query tabs — SQL and latest result]\n${describeAttachedQueries(attachedQ)}`;
  C.convo.push({ role: 'user', content });
  const turn = blankUsage();
  turn.steps = [];
  const clip = (v, n) => { const str = String(v ?? ''); return str.length > n ? str.slice(0, n) + '…' : str; };
  try {
    let step = 0;
    for (; step < MAX_STEPS; step++) {
      const ctx = contextFor(conv, C.convo);
      turn.ctx = { mode: ctx.mode, compacted: ctx.compacted };
      const payload = [{ role: 'system', content: systemPrompt() }, ...ctx.msgs];
      const sentChars = JSON.stringify(payload).length + JSON.stringify(TOOLS).length;
      const { msg, usage } = await callModel(payload, C.abort.signal);
      // Learn this model's characters-per-token from what the endpoint reports (smoothed).
      if (usage.in > 0) { const r = usage.in / sentChars, old = store.get(`tokRatio:${C.model}`, null); store.set(`tokRatio:${C.model}`, old ? old * 0.7 + r * 0.3 : r); }
      addUsage(turn, usage); addUsage(conv.usage, usage);
      const calls = msg.tool_calls || [];
      const stepRec = { model: usage.model, ms: usage.ms, in: usage.in, out: usage.out, cost: usage.cost, costKnown: usage.costKnown, text: clip(msg.content?.trim(), 220), tools: [] };
      turn.steps.push(stepRec);
      C.convo.push(calls.length ? { role: 'assistant', content: msg.content || '', tool_calls: calls } : { role: 'assistant', content: msg.content || '' });
      if (msg.content?.trim()) clerkPush({ k: 'ai', text: msg.content.trim(), model: usage.model, ms: usage.ms, tin: usage.in, tout: usage.out, cost: usage.cost, costKnown: usage.costKnown });
      if (!calls.length) break;
      for (const tc of calls) {
        const t0 = performance.now();
        const out = C.stop ? 'CANCELLED by the user.' : await clerkTool(tc);
        let args = tc.function.arguments || '';
        try { const a = JSON.parse(args); args = a.sql ?? (Object.keys(a).length ? JSON.stringify(a) : ''); } catch {}
        const outStr = typeof out === 'string' ? out : JSON.stringify(out);
        stepRec.tools.push({ name: tc.function.name, args: clip(args, 600), result: clip(outStr.replace(/\s*\n\s*/g, ' ⏎ '), 300), ms: Math.round(performance.now() - t0),
          ok: !/^(ERROR|DECLINED|CANCELLED)/.test(outStr), status: /^DECLINED/.test(outStr) ? 'declined' : /^CANCELLED/.test(outStr) ? 'cancelled' : /^ERROR/.test(outStr) ? 'error' : 'ok' });
        C.convo.push({ role: 'tool', tool_call_id: tc.id, content: typeof out === 'string' ? out : JSON.stringify(out) });
      }

    }
    // A cap on model calls per message, so a looping model can't run up cost unseen; Continue picks up where it stopped.

    if (C.stop) clerkPush({ k: 'note', text: 'Stopped.' });
  } catch (e) {

    if (turn.calls > 1 || turn.steps.some(st => st.tools.length)) C.items.push({ k: 'turn', ts: Date.now(), ...turn });
    C.busy = false; C.abort = null; C.approve = null;
    saveClerk(); renderClerk();
  }
}

  if (name === 'enable_extension') return clerkEnableExtension(String(a.name || ''), String(a.reason || ''));

    const title = a.title ? `${a.title} ${hms(Date.now())}` : `Clerk ${hms(Date.now())}`;
    openQuery(String(a.sql || ''), { title });
    clerkPush({ k: 'note', text: `placed SQL in “${title}”` });
    return 'Placed in a new editor tab; the user will review and run it.';
  }
  if (name === 'run_sql') return clerkRunSql(String(a.sql || '').trim());
  return `ERROR: unknown tool ${name}`;
}

async function clerkEnableExtension(name, reason) {
  const e = EXT_BY[name] || EXT_BY_SQL[name] || EXT_BY[name.replace(/-/g, '_')];
  if (!e) return `ERROR: "${name}" isn't available here. Available: ${EXT.map(extSql).join(', ')}.`;
  if (extEnabled(e.id)) return `${extSql(e)} is already enabled.`;
  const it = { k: 'sql', sql: `-- enable the ${extSql(e)} extension${e.kb >= 1000 ? ` (${extKb(e.kb)} download)` : ''}${reason ? `\n-- ${reason}` : ''}\ncreate extension if not exists "${extSql(e)}" cascade;`, status: 'pending', write: true, ts: Date.now() };
  const ok = C.allowAll || await approve(it);
  if (ok) {
    try { await enableExtensions([e.id], { src: 'clerk' }); it.status = 'applied'; it.summary = `${e.id} enabled`; }
    catch (err) { it.status = 'error'; it.error = err.message; }
  } else it.status = 'rejected';
  it.fresh = true;
  const idx = C.items.indexOf(it);
  if (idx >= 0) { C.items[idx] = it; saveClerk(); it._node?.replaceWith(receipt(it)); } else clerkPush(it);
  if (!ok) return 'DECLINED: the user did not approve enabling this extension.';
  if (it.error) return `ERROR: ${it.error}`;
  const v = (S.exts || []).find(x => x.extname === extSql(e))?.extversion;
  return `Enabled ${extSql(e)}${v ? ' ' + v : ''}. You can use it now.`;
}

/** Whether SQL can't be tried in a read-only transaction: a statement that ends it or steps out of it
 *  (COMMIT, END, ABORT, PREPARE TRANSACTION… — then later statements would run with nothing stopping
 *  a write), turns read-only off, or can't run in a transaction at all. Checked per statement. */
const RO_OFF = /^(set\s+(local\s+|session\s+)?(transaction\b|transaction_read_only\b)|set\s+session\s+characteristics\b|reset\s+(all|transaction_read_only)\b)/i;
const leavesReadOnly = sql => splitSql(sql).some(sp => { const t = stripLead(sql.slice(sp.s, sp.e)); return ownsTx(t) || RO_OFF.test(t); });

async function execRO(sql) {
  let out;
  const t0 = performance.now();
  try {
    await appTransaction(async tx => {
      await tx.exec('SET TRANSACTION READ ONLY');
      out = { results: (await tx.exec(sql, { rowMode: 'array' })).map(shapeResult) };
      await tx.rollback();
    });
  } catch (e) {
    if (!out) {
      if (e.code === '25006' || /read-only transaction/i.test(e.message)) return { needsWrite: true };
      out = { error: e.message };
    }
  }
  out.ms = Math.round(performance.now() - t0);
  return out;
}
async function execRW(sql) {
  if (!(await prodWriteOk(sql))) return { error: 'The user declined to run this on the production database.', ms: 0 }; // @remote
  const t0 = performance.now();
  try { return { results: (await S.db.exec(sql, { rowMode: 'array' })).map(shapeResult), ms: Math.round(performance.now() - t0) }; }
  catch (e) { return { error: e.message, ms: Math.round(performance.now() - t0) }; }
}

async function clerkRunSql(sql) {
  if (!sql) return 'ERROR: empty sql';
  const it = { k: 'sql', sql, status: 'pending', ts: Date.now() };
  /* @remote { */
  const gate = isProd() || (store.get('confirm', true) && !C.allowAll);   // production: always ask, every time
  /* } @remote */
  // @pages: const gate = store.get('confirm', true) && !C.allowAll;
  let r;
  if (gate) {
    r = leavesReadOnly(sql) ? { needsWrite: true } : await execRO(sql);
    if (r.needsWrite) {
      it.write = true;
      const ok = await approve(it);
      r = ok ? await execRW(sql) : { rejected: true };
    }
  } else {
    r = await execRW(sql);
    it.write = !isReadish(sql);
  }
  it.ms = r.ms; it.error = r.error;
  it.status = r.rejected ? 'rejected' : r.error ? 'error' : it.write ? 'applied' : 'ran';
  it.fresh = true;
  const last = r.results?.filter(x => x.fields.length).at(-1);
  if (last) it.preview = { fields: last.fields.map(f => f.name), rows: last.rows.slice(0, 5) };
  it.summary = r.results ? r.results.map(x => x.fields.length ? plural(x.rows.length, 'row') : x.affected ? `${plural(x.affected, 'row')} affected` : 'ok').join(' · ') : '';
  // Replace the pending card (if any) with the final one.
  const idx = C.items.indexOf(it);
  if (idx >= 0) { C.items[idx] = it; saveClerk(); it._node?.replaceWith(receipt(it)); }
  else clerkPush(it);
  if (!r.rejected) journalAdd({ src: 'clerk', sql, ms: r.ms, error: r.error, info: it.summary });
  if (it.write && !r.error && !r.rejected) await afterWrite();
  if (r.rejected) return 'DECLINED: the user did not approve this change.';
  if (r.error) { const sug = suggestExtension(r.error); return `ERROR: ${r.error}${sug && !extEnabled(sug.id) ? `\nHINT: the ${extSql(sug)} extension provides this — call enable_extension.` : ''}`; }
  return r.results.map(x => {
    if (!x.fields.length) return `OK${x.affected ? ` (${x.affected} rows affected)` : ''}`;
    const rows = x.rows.slice(0, 50);
    return `columns: ${JSON.stringify(x.fields.map(f => f.name))}\n${x.rows.length} rows${x.rows.length > rows.length ? ` (first ${rows.length})` : ''}:\n${rows.map(r => JSON.stringify(r)).join('\n')}`;
  }).join('\n---\n').slice(0, 9000) || 'OK';
}

function approve(it) {
  return new Promise(res => {
    C.items.push(it); saveClerk();
    const card = receipt(it, true);

    const bar = h('div', { class: 'r-ask' },

      /*remote:*/!isProd() && /*:remote*/h('button', { class: 'btn sm', onclick: () => { C.allowAll = true; done(true); } }, 'Approve all this session'),
      h('button', { class: 'btn sm red', onclick: () => done(false) }, 'Decline'));
    card.append(bar);

/* Per-database colour: 40 hues spaced evenly round the wheel in OKLCH, so every colour has the same
   perceived lightness and weight (no washed-out yellows or near-black blues). Day = ink tones that sit on
   cream paper; night = lighter tones for the dark sheet. Stored per database as a hue in degrees. */
const HUE_STEPS = 40, HUE_STEP = 360 / HUE_STEPS;
const OLD_HUES = [35, 268, 150, 80, 318, 200, 358, 245];      // the first 8-colour palette, for existing databases
const hexCache = new Map();
function oklchHex(L, C, hue) {
  const key = `${L}|${C}|${hue}`;
  if (hexCache.has(key)) return hexCache.get(key);
  const h = hue * Math.PI / 180;
  let hex = '#808080';
  for (let c = C; c >= 0; c -= 0.004) {                       // step chroma down until the colour fits in sRGB
    const a = c * Math.cos(h), b = c * Math.sin(h);
    const l = (L + 0.3963377774 * a + 0.2158037573 * b) ** 3, m = (L - 0.1055613458 * a - 0.0638541728 * b) ** 3, s3 = (L - 0.0894841775 * a - 1.2914855480 * b) ** 3;
    const rgb = [4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s3, -1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s3, -0.0041960863 * l - 0.7034186147 * m + 1.7076147010 * s3];
    if (rgb.every(v => v >= -0.001 && v <= 1.001)) {
      hex = '#' + rgb.map(v => { v = Math.min(1, Math.max(0, v)); v = v <= 0.0031308 ? 12.92 * v : 1.055 * v ** (1 / 2.4) - 0.055; return Math.round(v * 255).toString(16).padStart(2, '0'); }).join('');
      break;
    }
  }
  hexCache.set(key, hex);
  return hex;
}
/** A database's hue: chosen, else mapped from the old 8-colour index, else stable hash of its id. */
const dbHue = d => d?.hue != null ? d.hue
  : d?.color != null ? OLD_HUES[d.color % OLD_HUES.length]
  : ([...(d?.id || '')].reduce((a, c) => (a * 31 + c.charCodeAt(0)) >>> 0, 7) % HUE_STEPS) * HUE_STEP;
const hueColor = (hue, theme = document.documentElement.dataset.theme) => theme === 'night' ? oklchHex(0.78, 0.13, hue) : oklchHex(0.53, 0.15, hue);
const PROD_HUE = 27;          // production is always red, whatever colour it was given // @remote
const isProdDb = d => d?.kind === 'remote' && d.remote?.tag === 'prod'; // @remote
/* @remote { */
const dbColor = (d, theme) => d ? hueColor(isProdDb(d) ? PROD_HUE : dbHue(d), theme) : null;
/* } @remote */
// @pages: const dbColor = (d, theme) => d ? hueColor(dbHue(d), theme) : null;
function applyDbColor() {
  const c = dbColor(currentDb());
  c ? app.style.setProperty('--db', c) : app.style.removeProperty('--db');
  setFavicon(document.documentElement.dataset.theme);
}
/** A random hue from the 40, never `except`, preferring ones visibly far (≥ 27°) from other databases' hues. */
function randomHue(others, except) {
  const taken = others.map(dbHue);
  const dist = h => taken.length ? Math.min(...taken.map(t => { const d = Math.abs(h - t) % 360; return Math.min(d, 360 - d); })) : 360;
  const all = [...Array(HUE_STEPS).keys()].map(i => i * HUE_STEP).filter(h => except == null || Math.abs(h - except) > 0.5);
  const best = Math.max(...all.map(dist));
  const pool = all.filter(h => dist(h) >= Math.min(27, best));
  return pool[Math.floor(Math.random() * pool.length)];
}
/** Give a database a new random colour; returns the new colour value. */
function recolorDb(id) {
  const dbs = loadDbs(), d = dbs.find(x => x.id === id);
  d.hue = randomHue(dbs.filter(x => x.id !== id), dbHue(d));
  delete d.color;
  saveDbs(dbs);
  if (id === S.id) applyDbColor();
  return dbColor(d);
}

/* ---------- updates & reload ----------
   Opened from a file: browsers don't cache local files, so a reload always runs the latest file.
   Hosted (e.g. GitHub Pages): the page can come from cache, so we fetch our own URL fresh, fingerprint
   it, and compare with what was served when this tab loaded. Reloading adds a throwaway ?_v= query
   to bypass any cached copy; it's removed again once the new version starts. */
const HOSTED = /^https?:$/.test(location.protocol);
const upd = { base: null, available: false, checkedAt: 0 };
async function pageFingerprint() {
  const u = new URL(location.href); u.hash = ''; u.searchParams.delete('_v');
  const res = await fetch(u, { cache: 'no-store' });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const hash = new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(await res.text())));
  return Array.from(hash.slice(0, 8), b => b.toString(16).padStart(2, '0')).join('');
}
async function checkForUpdate() {
  if (!HOSTED) return null;
  upd.checkedAt = Date.now();
  try {
    const fp = await pageFingerprint();
    if (!upd.base) upd.base = fp;
    upd.available = fp !== upd.base;
  } catch { return null; }
  const b = $('updateBtn');
  b.classList.toggle('has-update', upd.available);
  b.title = upd.available ? 'New version available — reload to update' : 'Reload';
  return upd.available;
}
async function reloadApp() {
  if (C.busy && !(await confirmDlg({ title: 'The Clerk is still working', body: 'Reloading stops its current request. Everything else is saved first.', ok: 'Reload anyway' }))) return;
  $('updateBtn').classList.add('spin');
  if (HOSTED) { const a = await checkForUpdate(); toast(a ? 'Updating to the latest version…' : a === false ? 'Already up to date — reloading…' : 'Reloading…'); }
  try { persistTabs(); saveClerk(); await kvFlush(); } catch {}
  if (HOSTED) { const u = new URL(location.href); u.searchParams.set('_v', Date.now().toString(36)); location.replace(u); }
  else location.reload();
}

  await openDb((dbs.find(d => d.id === saved) || dbs[0] || newDbMeta()).id);
  openSharedLink();
})();
window.addEventListener('beforeunload', () => { persistTabs(); saveClerk(); kvFlush(); });
</script>
