# Push a tag like v1.0.0 (v + APP_VERSION in server/index-remote.html) to build the pgquire server for
# Linux, macOS and Windows, attach the archives to a GitHub release (.goreleaser.yaml), and publish
# the Docker image to ghcr.io/abiddotdev/pgquire.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Tag matches the app version
        run: |
          page=$(grep -oP "const APP_VERSION = '\K[^']+" server/index-remote.html)
          [ "v$page" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME but server/index-remote.html says $page"; exit 1; }
      - run: go test -count=1 ./...
        working-directory: server
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}

  docker:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: ver
        run: echo "v=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ steps.ver.outputs.v }}
          push: true
          tags: |
            ghcr.io/abiddotdev/pgquire:${{ steps.ver.outputs.v }}
            ghcr.io/abiddotdev/pgquire:latest
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
