# Push a tag like v1.0 (matching APP_VERSION in index.html) to build the pgquire server for
# Linux, macOS and Windows and attach the archives to a GitHub release.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Tag matches the app version
        run: |
          page=$(grep -oP "const APP_VERSION = '\K[^']+" index.html)
          [ "v$page" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME but index.html says $page"; exit 1; }
      - run: go test -count=1 ./...
      - name: Build
        run: |
          ver="${GITHUB_REF_NAME#v}"
          mkdir dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os="${target%/*}"; arch="${target#*/}"; ext=""; [ "$os" = windows ] && ext=".exe"
            dir="pgquire_${ver}_${os}_${arch}"
            mkdir "$dir"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w -X main.Version=$ver" -o "$dir/pgquire$ext" .
            cp README.md "$dir/"
            if [ "$os" = windows ]; then zip -qr "dist/$dir.zip" "$dir"; else tar -czf "dist/$dir.tar.gz" "$dir"; fi
          done
          (cd dist && sha256sum * > checksums.txt)
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "pgquire $GITHUB_REF_NAME" --generate-notes
