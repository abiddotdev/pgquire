# Release builds of the pgquire server: run by .github/workflows/release.yml on a v* tag.
# Try it locally with `goreleaser release --snapshot --clean` (writes dist/).
version: 2
project_name: pgquire

builds:
  - dir: server
    binary: pgquire
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags: ["-s -w -X main.Version={{ .Version }}"]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    wrap_in_directory: true
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [README.md]

checksum:
  name_template: checksums.txt

changelog:
  use: github-native

release:
  name_template: "pgquire {{ .Tag }}"
